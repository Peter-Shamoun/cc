<h2 class="sr-only">Flowchart of one ClaimClarity chat turn: Investigator plans, server checks and queries claims data, optional payer pick, server builds findings, Writer writes prose, server fills numbers and saves the answer. Lane 2 is shown dashed and disconnected.</h2>
<div id="flow"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const themeMode = document.documentElement.dataset.mode;
const dark = themeMode ? themeMode === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"anthropic-sans", sans-serif',
  flowchart: { htmlLabels: true, curve: 'basis' },
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"anthropic-sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#2C2C2A' : '#F1EFE8',
    primaryBorderColor: dark ? '#888780' : '#B4B2A9',
    clusterBkg: dark ? '#26215C' : '#EEEDFE',
    clusterBorder: dark ? '#AFA9EC' : '#7F77DD',
  },
});
const src = `flowchart TD
  U["User question"] --> I
  subgraph AI1["AI: plan"]
    I["Investigator<br/>picks typed tasks"]
  end
  I -->|"run_tasks"| S
  S["Server checks the plan<br/>against business definitions"] --> P{"Payer name<br/>clear?"}
  P -->|"no"| R["Payer Resolver (AI)<br/>suggests names"] --> C["User picks payers"] --> Q
  P -->|"yes"| Q["Server builds the query<br/>from fixed definitions"]
  Q --> D[("Claims data<br/>Neo4j / DuckDB")]
  D --> E["Results + evidence"]
  E -.->|"short summary,<br/>may plan another step"| I
  E --> F["Server builds tables,<br/>charts, findings"]
  subgraph AI2["AI: write"]
    W["Writer<br/>prose with placeholders"]
  end
  F --> W
  W --> V["Server fills in numbers<br/>and checks each sentence"]
  V --> A["Answer saved, then shown"]
  X["Lane 2: AI-written SQL<br/>(built, not connected)"]:::off -.-> D
  classDef off stroke-dasharray: 5 5,color:#888`;
const { svg } = await mermaid.render('flow-svg', src);
document.getElementById('flow').innerHTML = svg;
</script>
