<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ClaimClarity Architecture Canvas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Generated by tools/build_canvas.py from tools/canvas_template.html. Edit the template or the boards, then rebuild. -->
<style>
/* One light drafting-table look on purpose: the boards are white paper on a blue-grey table. */
:root {
  --navy: #1C2B57; --blue: #4A6BB0; --table: #DCE2EC; --paper: #FFFFFF; --ink: #1A1D23; --soft: #5B6472;
  --chip: rgba(255,255,255,.12); --chip-line: rgba(255,255,255,.28);
  --ui: 'Barlow', Arial, sans-serif; --display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  color-scheme: light;
}
html, body { height: 100%; margin: 0; }
body { background: var(--table); color: var(--ink); font: 13px/1.4 var(--ui); display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; background: var(--navy); color: var(--paper);
         padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
header h1 { font: 700 17px var(--display); letter-spacing: .06em; text-transform: uppercase; margin: 0 10px 0 0; white-space: nowrap; }
header button { background: var(--chip); border: 1px solid var(--chip-line); color: var(--paper); border-radius: 4px;
                padding: 4px 9px; font: inherit; cursor: pointer; white-space: nowrap; }
header button:hover, header button.on { background: var(--paper); color: var(--navy); }
header button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }
header .spacer { flex: 1; }
header .zoom { min-width: 46px; text-align: center; font-variant-numeric: tabular-nums; }
#stage { position: relative; overflow: hidden; touch-action: none; cursor: grab; min-height: 0; }
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
.board { position: absolute; background: var(--paper); border-radius: 6px; box-shadow: 0 2px 4px rgba(28,43,87,.10), 0 18px 48px rgba(28,43,87,.16); }
.board svg { display: block; width: 100%; height: 100%; }
#links { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
#hint { position: absolute; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(10px, env(safe-area-inset-bottom, 0px));
        background: rgba(28,43,87,.88); color: var(--paper); padding: 5px 10px; border-radius: 4px; font-size: 12px; pointer-events: none; }
@media (prefers-reduced-motion: reduce) { #world { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1>ClaimClarity architecture</h1>
  <button id="fit" type="button" title="Show everything (0)">Fit all</button>
  <span id="chips"></span>
  <span class="spacer"></span>
  <button id="zoomOut" type="button" title="Zoom out">−</button>
  <span class="zoom" id="zoomLabel">100%</span>
  <button id="zoomIn" type="button" title="Zoom in">+</button>
</header>
<div id="stage">
  <div id="world">
    <svg id="links"></svg>
<!--__BOARDS__-->
  </div>
  <div id="hint">Drag to pan · scroll or pinch to zoom · double-click a board to zoom to it</div>
</div>
<script>
"use strict";
const CANVAS = "__CANVAS__";
const stage = document.getElementById("stage"), world = document.getElementById("world");
const [BX, BY, BW, BH] = CANVAS.bounds;
world.style.width = BW + "px"; world.style.height = BH + "px";
const view = { x: 0, y: 0, z: 0.1 };

/* dashed connectors from each zoom badge on the main board to its drill-down */
const links = document.getElementById("links");
links.setAttribute("width", BW); links.setAttribute("height", BH);
links.innerHTML = CANVAS.links.map(({ number, start, end }) => {
  const [x1, y1, x2, y2] = [start[0] - BX, start[1] - BY, end[0] - BX, end[1] - BY];
  return `<path d="M${x1},${y1} L${x2},${y2}" stroke="#4A6BB0" stroke-width="7" stroke-dasharray="26 16" fill="none" opacity=".75"/>` +
         `<circle cx="${x2}" cy="${y2}" r="34" fill="#4A6BB0" stroke="#fff" stroke-width="5"/>` +
         `<text x="${x2}" y="${y2 + 12}" text-anchor="middle" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="34" fill="#fff">${number}</text>`;
}).join("");

function apply(animate) {
  world.style.transition = animate ? "transform .45s ease" : "none";
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  document.getElementById("zoomLabel").textContent = Math.round(view.z * 100) + "%";
}
function frame(x, y, w, h, animate, pad = 40) {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const z = Math.min((sw - pad * 2) / w, (sh - pad * 2) / h);
  view.z = z; view.x = (sw - w * z) / 2 - (x - BX) * z; view.y = (sh - h * z) / 2 - (y - BY) * z;
  apply(animate);
}
const fitAll = animate => frame(BX + 300, BY + 300, BW - 600, BH - 600, animate, 24);
function showBoard(slug, animate = true) {
  const item = CANVAS.items.find(i => i.slug === slug);
  if (!item) return fitAll(animate);
  frame(item.x, item.y, item.w, item.h, animate);
  document.querySelectorAll("#chips button").forEach(b => b.classList.toggle("on", b.dataset.slug === slug));
}
function zoomAt(factor, cx, cy) {
  const r = stage.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  const z = Math.min(3, Math.max(0.02, view.z * factor));
  view.x = px - (px - view.x) * z / view.z; view.y = py - (py - view.y) * z / view.z; view.z = z;
  apply(false);
}

/* board chips in the header */
const chips = document.getElementById("chips");
for (const item of CANVAS.items) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.slug = item.slug;
  b.textContent = item.slug === "main" ? "Main board" : `${item.slug.slice(0, 2)} · ${item.title.replace(/^\d\d · /, "")}`;
  b.addEventListener("click", () => { history.replaceState(null, "", "#" + item.slug); showBoard(item.slug); });
  chips.appendChild(b);
}
document.getElementById("fit").addEventListener("click", () => { history.replaceState(null, "", location.pathname); fitAll(true);
  document.querySelectorAll("#chips button").forEach(b => b.classList.remove("on")); });
document.getElementById("zoomIn").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(1.3, r.left + r.width / 2, r.top + r.height / 2); });
document.getElementById("zoomOut").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2); });

/* pan with one pointer, pinch with two */
const pointers = new Map();
let pinch = null;
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  stage.classList.add("dragging");
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; }
});
stage.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const [px, py] = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) { view.x += e.clientX - px; view.y += e.clientY - py; apply(false); }
  else if (pinch) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomAt(d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch.d = d;
  }
});
const release = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release);
stage.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.shiftKey) { view.x -= e.deltaY; apply(false); return; }
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
}, { passive: false });
stage.addEventListener("dblclick", e => { const b = e.target.closest(".board"); if (b) showBoard(b.dataset.slug); });
document.addEventListener("keydown", e => { if (e.key === "0") fitAll(true); });
window.addEventListener("resize", () => fitAll(false));
window.addEventListener("hashchange", () => showBoard(location.hash.slice(1)));
const start = location.hash.slice(1);
if (start && CANVAS.items.some(i => i.slug === start)) showBoard(start, false); else fitAll(false);
</script>
</body>
</html>
