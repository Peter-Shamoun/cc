<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ClaimClarity Diagram Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,500&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<!-- Generated by tools/build_editor.py from tools/diagram_editor_template.html. Edit the template, then rebuild. -->
<style>
:root {
  --navy: #1C2B57; --blue: #4A6BB0; --tint: #EAF0F9; --ink: #1A1D23; --line: #C9CBCE; --soft: #5B6472;
  --chrome: #F6F8FB; --panel: #FFFFFF; --canvas: #E4E8EF; --focus: #4A6BB0;
  color-scheme: light;
}
/* Narrow screens: canvas on top, palette and inspector stacked below it. */
@media (max-width: 900px) {
  body { grid-template-rows: auto 1fr; overflow: auto; }
  header { flex-wrap: wrap; padding-block: 6px; padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
  main { grid-template-columns: 1fr; grid-template-rows: 60vh auto auto; overflow: visible; }
  #palette { order: 2; border-right: 0; border-top: 1px solid var(--line); max-height: 50vh; }
  #inspector { order: 3; border-left: 0; border-top: 1px solid var(--line); }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 13px/1.4 'Barlow', Arial, sans-serif; color: var(--ink); background: var(--chrome); display: grid;
       grid-template-rows: 48px 1fr; overflow: hidden; }
header { display: flex; align-items: center; gap: 6px; padding: 0 12px; background: var(--navy); color: #fff; }
header h1 { font: 700 17px 'Barlow Condensed', sans-serif; letter-spacing: .06em; text-transform: uppercase; margin: 0 12px 0 0; white-space: nowrap; }
header .sep { width: 1px; height: 24px; background: rgba(255,255,255,.25); margin: 0 4px; }
header .spacer { flex: 1; }
button, select, input, textarea { font: inherit; color: inherit; }
header button, header select { background: rgba(255,255,255,.1); border: 1px solid rgba(255,255,255,.25); color: #fff;
       border-radius: 4px; padding: 4px 9px; cursor: pointer; white-space: nowrap; }
header select option { color: var(--ink); }
header button:hover { background: rgba(255,255,255,.2); }
header button.on { background: #fff; color: var(--navy); }
header .zoom { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }
main { display: grid; grid-template-columns: 252px 1fr 300px; min-height: 0; overflow: hidden; }
aside { background: var(--panel); overflow-y: auto; min-height: 0; }
#palette { border-right: 1px solid var(--line); }
#inspector { border-left: 1px solid var(--line); padding: 12px 14px 40px; }
.psec { border-bottom: 1px solid #E6E9EE; }
.psec > summary { font: 700 13px 'Barlow Condensed', sans-serif; letter-spacing: .08em; text-transform: uppercase; color: var(--navy);
       padding: 10px 12px; cursor: pointer; user-select: none; list-style: none; display: flex; justify-content: space-between; }
.psec > summary::after { content: '+'; color: var(--soft); }
.psec[open] > summary::after { content: '−'; }
.pgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 10px 12px; }
.pgrid.wide { grid-template-columns: 1fr; }
.pitem { border: 1px solid #E1E5EC; border-radius: 6px; background: #fff; padding: 6px; cursor: grab; display: flex; flex-direction: column;
       align-items: center; gap: 4px; user-select: none; touch-action: none; text-align: center; }
.pitem:hover { border-color: var(--blue); background: #F7F9FD; }
.pitem.on { border-color: var(--navy); box-shadow: inset 0 0 0 1px var(--navy); }
.pitem svg { width: 100%; height: 46px; pointer-events: none; }
.pgrid.wide .pitem { flex-direction: row; justify-content: flex-start; text-align: left; }
.pgrid.wide .pitem svg { width: 76px; height: 26px; flex: none; }
.pitem span { font-size: 11.5px; line-height: 1.2; color: var(--ink); }
#psearch { margin: 10px 10px 4px; width: calc(100% - 20px); padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px; }
#stage { position: relative; background: var(--canvas); min-width: 0; min-height: 0; overflow: hidden; }
#svg { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; }
#stage.tool-arrow #svg { cursor: crosshair; }
#stage.panning #svg { cursor: grabbing; }
#hint { position: absolute; left: 12px; bottom: 10px; background: rgba(28,43,87,.88); color: #fff; padding: 5px 10px; border-radius: 4px;
       font-size: 12px; pointer-events: none; }
#toast { position: absolute; right: 12px; bottom: 10px; background: #fff; border: 1px solid var(--line); padding: 6px 10px; border-radius: 4px;
       font-size: 12px; opacity: 0; transition: opacity .2s; pointer-events: none; }
#toast.show { opacity: 1; }
#inspector h2 { font: 700 15px 'Barlow Condensed', sans-serif; letter-spacing: .07em; text-transform: uppercase; color: var(--navy); margin: 0 0 10px; }
#inspector label { display: block; font-size: 11.5px; font-weight: 600; color: var(--soft); margin: 10px 0 3px; }
#inspector input[type=text], #inspector input[type=number], #inspector select, #inspector textarea {
       width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: #fff; }
#inspector textarea { resize: vertical; min-height: 54px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
#inspector input:focus, #inspector select:focus, #inspector textarea:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }
#inspector .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
#inspector .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
#inspector .check { display: flex; align-items: center; gap: 6px; font-weight: 500; color: var(--ink); margin-top: 10px; }
#inspector .help { font-size: 11.5px; color: var(--soft); margin: 4px 0 0; }
#inspector .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
#inspector .btns button { border: 1px solid var(--line); background: #fff; border-radius: 4px; padding: 4px 9px; cursor: pointer; }
#inspector .btns button:hover { border-color: var(--blue); }
#inspector .btns button.danger { color: #B42318; }
#inspector kbd { font: 11px 'IBM Plex Mono', monospace; background: var(--tint); border-radius: 3px; padding: 0 4px; }
#inspector ul { padding-left: 16px; margin: 6px 0; }
#inspector li { margin: 3px 0; }
.icon-pick { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; max-height: 160px; overflow-y: auto; border: 1px solid var(--line);
       border-radius: 4px; padding: 4px; }
.icon-pick button { border: 1px solid transparent; background: #fff; border-radius: 4px; padding: 2px; height: 34px; cursor: pointer; }
.icon-pick button.on { border-color: var(--navy); background: var(--tint); }
.icon-pick button svg { width: 26px; height: 26px; pointer-events: none; }
.icon-pick button.none { font-size: 11px; color: var(--soft); }
</style>
</head>
<body>
<header>
  <h1>ClaimClarity diagram editor</h1>
  <select id="boardPick" title="Board"></select>
  <button id="btnNew" title="New blank board">New</button>
  <button id="btnRevert" title="Discard your edits and reload the published version of this board">Revert</button>
  <span class="sep"></span>
  <button id="btnOpen" title="Open a saved .json board">Open…</button>

  <span class="spacer"></span>
  <button id="btnUndo" title="Undo (Ctrl+Z)">Undo</button>
  <button id="btnRedo" title="Redo (Ctrl+Shift+Z)">Redo</button>
  <span class="sep"></span>
  <button id="btnZoomOut" title="Zoom out">−</button>
  <span class="zoom" id="zoomLabel">100%</span>
  <button id="btnZoomIn" title="Zoom in">+</button>
  <button id="btnFit" title="Fit the board (F)">Fit</button>
  <input type="file" id="fileOpen" accept=".json,application/json" hidden>
  <input type="file" id="fileImage" accept="image/*" hidden>
</header>
<main>
  <aside id="palette"><input id="psearch" type="search" placeholder="Search shapes and services"></aside>
  <div id="stage">

      </g>
    </svg>
    <div id="hint"></div>
    <div id="toast"></div>
  </div>
  <aside id="inspector"></aside>
</main>

const NAVY = "#1C2B57", BLUE = "#4A6BB0", TINT = "#EAF0F9", INK = "#1A1D23", LINE = "#C9CBCE";
const SOFT = "#5B6472", LINK = "#3A5A9E", DENY = "#B42318", PAPER = "#FFFFFF", BUILT = "#C2255C";
const COND = "'Barlow Condensed', 'Arial Narrow', sans-serif", SANS = "'Barlow', Arial, sans-serif", MONO = "'IBM Plex Mono', ui-monospace, monospace";
const FONTS_URL = "https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap";
const NAME = 18, SUB = 14, ALAB = 15, GLAB = 16, GR = 36;

const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const splitLines = s => (s ? String(s).split("\n") : []);
const r0 = v => Math.round(v);

function T(x, y, s, size, fam, fill, weight = 400, anchor = "start", ls = null, italic = false) {
  return `<text x="${x}" y="${y}" font-family="${fam}" font-size="${size}" font-weight="${weight}" fill="${fill}" ` +
         `text-anchor="${anchor}"${ls ? ` letter-spacing="${ls}"` : ""}${italic ? ' font-style="italic"' : ""}>${esc(s)}</text>`;
}

const measureContext = document.createElement("canvas").getContext("2d");
const FONT_SPECS = { sans: "600 SIZEpx Barlow", sans4: "400 SIZEpx Barlow", cond: "600 SIZEpx 'Barlow Condensed'",
                     caps: "600 SIZEpx 'Barlow Condensed'", mono: "500 SIZEpx 'IBM Plex Mono'" };
function tw(s, size, fam = "sans") {
  measureContext.font = FONT_SPECS[fam].replace("SIZE", size);
  const width = measureContext.measureText(fam === "caps" ? String(s).toUpperCase() : String(s)).width;
  return width * (fam === "caps" ? 1.04 : 1);
}

function placeIcon(name, x, y, s) {
  if (GLYPHS[name]) {
    return `<g transform="translate(${x},${y}) scale(${(s / 24).toFixed(4)})" fill="none" stroke="${NAVY}" stroke-width="1.6" ` +
           `stroke-linecap="round" stroke-linejoin="round">${GLYPHS[name]}</g>`;
  }
  const icon = AWS_ICONS[name];
  if (!icon) return "";
  return `<svg x="${x}" y="${y}" width="${s}" height="${s}" viewBox="${icon[0]}" overflow="visible">${icon[1]}</svg>`;
}

function roundedPath(pts, r = 10) {
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], [x2, y2] = pts[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
    if (!l1 || !l2) continue;
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const ax = x1 - (x1 - x0) / l1 * rr, ay = y1 - (y1 - y0) / l1 * rr;
    const bx = x1 + (x2 - x1) / l2 * rr, by = y1 + (y2 - y1) / l2 * rr;
    d += ` L${ax.toFixed(1)},${ay.toFixed(1)} Q${x1},${y1} ${bx.toFixed(1)},${by.toFixed(1)}`;
  }
  const last = pts[pts.length - 1];
  return d + ` L${last[0]},${last[1]}`;
}

const ZONE_STYLES = {
  bucket: [`fill="none" stroke="${BLUE}" stroke-width="1.6"`, BLUE],
  phi: [`fill="none" stroke="${NAVY}" stroke-width="1.8" stroke-dasharray="9 5"`, NAVY],
  aws: [`fill="none" stroke="${INK}" stroke-width="1.4"`, INK],
  vpc: [`fill="none" stroke="#8C4FFF" stroke-width="1.6"`, "#6B3BCC"],
  subnet: [`fill="${TINT}" fill-opacity="0.45" stroke="${BLUE}" stroke-width="1.2" stroke-dasharray="5 4"`, LINK],
  worker: [`fill="${TINT}" fill-opacity="0.35" stroke="#ED7100" stroke-width="1.6"`, "#B35400"],
  plain: [`fill="none" stroke="${LINE}" stroke-width="1.2"`, SOFT],
  denied: [`fill="#FDF1F0" fill-opacity="0.6" stroke="${DENY}" stroke-width="1.6" stroke-dasharray="8 5"`, DENY],
  accent: [`fill="none" stroke="${NAVY}" stroke-width="2.2"`, NAVY],
  dashed: [`fill="none" stroke="${BLUE}" stroke-width="1.6" stroke-dasharray="8 5"`, LINK],
  lane: [`fill="${TINT}" fill-opacity="0.30" stroke="none"`, SOFT],
};

function zoneLabelBox(z) {
  if (!z.label) return null;
  const lx = z.x + (z.icon ? 46 : 14);
  return [lx - 4, z.y + 12, tw(z.label, 15, "caps") + 12, 22];
}

function svgZone(z) {
  const { x, y, w, h, kind: k } = z;
  const sty = ZONE_STYLES[k] || ZONE_STYLES.plain;
  const out = [`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${["aws", "vpc", "lane"].includes(k) ? 0 : 6}" ${sty[0]}/>`];
  let lx = x + 14;
  if (z.icon) { out.push(placeIcon(z.icon, x + 12, y + 10, 26)); lx = x + 46; }
  if (!z.label) return out.join("");
  out.push(`<rect x="${lx - 4}" y="${y + 12}" width="${r0(tw(z.label, 15, "caps") + 12)}" height="22" fill="${PAPER}" ` +
           `opacity="${["subnet", "worker", "lane", "denied"].includes(k) ? 0 : 1}"/>`);
  out.push(T(lx, y + 29, z.label.toUpperCase(), 15, COND, sty[1], 700, "start", "0.06em"));
  return out.join("");
}

function cylinder(x, y, w, h, fill, stroke, sw = 1.4) {
  const ry = Math.min(12, h * 0.12);
  return `<path d="M${x},${y + ry} A${w / 2},${ry} 0 0 1 ${x + w},${y + ry} V${y + h - ry} A${w / 2},${ry} 0 0 1 ${x},${y + h - ry} Z" ` +
         `fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>` +
         `<path d="M${x},${y + ry} A${w / 2},${ry} 0 0 0 ${x + w},${y + ry}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>`;
}

const isMono = s => s.trimEnd().endsWith("/") || s.startsWith("_") || s.endsWith(".py") || s.endsWith(".*") || s.startsWith("customer_");

function nodeLayout(n) {
  const { x, y, w, h, shape } = n;
  const names = splitLines(n.name), subs = splitLines(n.sub);
  const topPad = { db: 12, folder: 8, ui: 18 }[shape] || 0;
  const ic = ["decision", "steps", "grid", "code", "table", "image", "badge"].includes(shape) ? null : n.icon;
  const isz = h >= 76 ? 40 : 32;
  const left = x + (shape === "agent" ? 30 : 16);
  const tx = ic ? left + isz + 12 : x + w / 2, anchor = ic ? "start" : "middle";
  const lh = names.length * 22 + subs.length * 18;
  let y0 = y + topPad + (h - topPad - lh) / 2 + 16;
  if (n.valign === "bottom") y0 = y + h - lh - 10 + 16;
  else if (n.valign === "top") y0 = y + topPad + 14 + 16;
  return { names, subs, ic, isz, left, tx, anchor, y0, topPad };
}

function svgNode(n) {
  const { x, y, w, h, shape, style } = n;
  let fill = TINT, stroke = BLUE, txt = INK, dash = "";
  const sw = 1.4;
  if (style === "white") fill = PAPER;
  else if (style === "external") { fill = PAPER; stroke = "#7A7F88"; dash = ' stroke-dasharray="5 4"'; }
  else if (style === "optional") { fill = PAPER; stroke = BLUE; dash = ' stroke-dasharray="6 4"'; }
  else if (style === "focal") { fill = NAVY; stroke = NAVY; txt = PAPER; }
  else if (style === "denied") { fill = "#FDF1F0"; stroke = DENY; dash = ' stroke-dasharray="6 4"'; }
  const out = [];
  if (shape === "image") {
    out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${PAPER}" stroke="${BLUE}" stroke-width="1.4"/>`);
    if (n.href) out.push(`<image x="${x + 1}" y="${y + 1}" width="${w - 2}" height="${h - 2}" preserveAspectRatio="xMidYMid ${n.fit || "slice"}" href="${esc(n.href)}"/>`);
    else out.push(T(x + w / 2, y + h / 2 + 5, "Choose an image in the panel →", 14, SANS, SOFT, 500, "middle"));
    return out.join("");
  }
  if (shape === "badge") {
    const r = Math.min(w, h) / 2, cx = x + w / 2, cy = y + h / 2;
    out.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${style === "focal" ? NAVY : BLUE}" stroke="${PAPER}" stroke-width="2"/>`);
    out.push(T(cx, cy + r * 0.32, n.name || "", r0(r * 0.9), COND, PAPER, 700, "middle"));
    return out.join("");
  }
  if (["box", "steps", "ui", "grid", "table"].includes(shape)) {
    out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>`);
  } else if (shape === "db") {
    out.push(cylinder(x, y, w, h, fill, stroke));
  } else if (shape === "folder") {
    out.push(`<path d="M${x},${y + 12} V${y + 4} Q${x},${y} ${x + 4},${y} H${x + 46} L${x + 56},${y + 10} H${x + w - 4} Q${x + w},${y + 10} ${x + w},${y + 14} ` +
             `V${y + h - 4} Q${x + w},${y + h} ${x + w - 4},${y + h} H${x + 4} Q${x},${y + h} ${x},${y + h - 4} Z" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"${dash}/>`);
  } else if (shape === "file" || shape === "token") {
    const f = 18;
    out.push(`<path d="M${x},${y} H${x + w - f} L${x + w},${y + f} V${y + h} H${x} Z" fill="${shape === "file" ? fill : PAPER}" stroke="${stroke}" stroke-width="${sw}"${dash}/>` +
             `<path d="M${x + w - f},${y} V${y + f} H${x + w}" fill="none" stroke="${stroke}" stroke-width="${sw}"/>`);
  } else if (shape === "agent") {
    const k = 24;
    out.push(`<path d="M${x + k},${y} H${x + w - k} L${x + w},${y + h / 2} L${x + w - k},${y + h} H${x + k} L${x},${y + h / 2} Z" fill="${NAVY}" stroke="${NAVY}"/>`);
    txt = PAPER;
  } else if (shape === "decision") {
    const cx = x + w / 2, cy = y + h / 2;
    out.push(`<path d="M${cx},${y} L${x + w},${cy} L${cx},${y + h} L${x},${cy} Z" fill="${PAPER}" stroke="${NAVY}" stroke-width="1.8"/>`);
  }
  if (shape === "ui") {
    out.push(`<rect x="${x}" y="${y}" width="${w}" height="18" rx="4" fill="${NAVY}"/>` +
             `<circle cx="${x + 12}" cy="${y + 9}" r="3" fill="${PAPER}"/><circle cx="${x + 22}" cy="${y + 9}" r="3" fill="${PAPER}"/>` +
             `<rect x="${x + 16}" y="${y + h - 36}" width="${w - 32}" height="22" rx="11" fill="${PAPER}" stroke="${LINE}"/>`);
  }
  const L = nodeLayout(n);
  if (shape === "table") {
    const rows = (n.inner && n.inner.length) ? n.inner : [["column"]];
    out.push(T(x + 16, y + 28, L.names[0] || "", NAME - 1, SANS, txt, 600));
    const ty = y + 44, rh = (h - 44 - 10) / rows.length;
    const cw = n.colw || (w - 32) / Math.max(1, rows[0].length);
    rows.forEach((row, i) => {
      const ry = ty + i * rh, head = i === 0;
      out.push(`<rect x="${x + 16}" y="${r0(ry)}" width="${w - 32}" height="${r0(rh)}" fill="${head ? NAVY : PAPER}" stroke="${BLUE}" stroke-width="1"/>`);
      row.forEach((cell, j) => {
        const cx0 = x + 16 + j * cw;
        if (j) out.push(`<line x1="${r0(cx0)}" y1="${r0(ry)}" x2="${r0(cx0)}" y2="${r0(ry + rh)}" stroke="${BLUE}" stroke-width="1"/>`);
        const mono = isMono(cell) || cell.includes("_");
        out.push(T(cx0 + 10, ry + rh / 2 + 5, cell, 14, mono && !head ? MONO : SANS, head ? PAPER : INK, head ? 600 : 400));
      });
    });
  } else if (shape === "code") {
    out.push(`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${NAVY}"/>` +
             `<rect x="${x}" y="${y}" width="${w}" height="40" rx="6" fill="#24366B"/><rect x="${x}" y="${y + 30}" width="${w}" height="10" fill="#24366B"/>`);
    out.push(T(x + 18, y + 26, L.names[0] || "", 15, SANS, PAPER, 600));
    if (L.subs.length) out.push(T(x + w - 18, y + 26, L.subs[0], 13, SANS, "#AFC2E6", 400, "end"));
    (n.inner || []).forEach((line, i) => {
      const ly = y + 66 + i * 21;
      const m = line.match(/^(\s*)(.*)$/);
      const parts = m[2].split(/("[^"]*"\s*:)/);
      const tspans = parts.filter(Boolean).map(p => `<tspan fill="${p.endsWith(":") ? "#AFC2E6" : "#FFFFFF"}">${esc(p)}</tspan>`).join("");
      out.push(`<text x="${x + 18 + m[1].length * 8}" y="${ly}" font-family="${MONO}" font-size="13.5" xml:space="preserve">${tspans}</text>`);
    });
  } else if (shape === "grid") {
    out.push(T(x + 18, y + 34, L.names[0] || "", NAME, SANS, txt, 600));
    const items = n.inner || [], cols = n.cols || 2, cw = (w - 36) / cols;
    items.forEach(([icon, lab], i) => {
      const cx0 = x + 18 + (i % cols) * cw, cy0 = y + 58 + Math.floor(i / cols) * 46;
      out.push(placeIcon(icon, cx0, cy0, 32) + T(cx0 + 42, cy0 + 22, lab || "", 15, SANS, INK, 500));
    });
  } else if (shape === "steps") {
    let hx = x + 18;
    if (n.icon) { out.push(placeIcon(n.icon, x + 16, y + 14, 34)); hx = x + 62; }
    out.push(T(hx, y + 37, L.names[0] || "", NAME, SANS, txt, 600));
    if (n.badge && n.badge[1]) {
      const [g, lab] = n.badge, bw = tw(lab, SUB, "sans") + 46;
      out.push(`<rect x="${x + w - bw - 14}" y="${y + 14}" width="${r0(bw)}" height="32" rx="16" fill="${PAPER}" stroke="${NAVY}" stroke-width="1.2"/>` +
               placeIcon(g, x + w - bw - 2, y + 18, 24) + T(x + w - bw + 28, y + 35, lab, SUB, SANS, NAVY, 600));
    }
    const steps = (n.inner && n.inner.length) ? n.inner : ["step"];
    const ly = y + h - 50, x0 = x + 50, x1 = x + w - 50;
    out.push(`<line x1="${x0}" y1="${ly}" x2="${x1}" y2="${ly}" stroke="${BLUE}" stroke-width="1.6"/>`);
    steps.forEach((st, i) => {
      const sx = steps.length > 1 ? x0 + (x1 - x0) * i / (steps.length - 1) : (x0 + x1) / 2, last = i === steps.length - 1;
      out.push(`<circle cx="${sx}" cy="${ly}" r="8" fill="${last ? NAVY : PAPER}" stroke="${NAVY}" stroke-width="1.8"/>`);
      out.push(T(sx, ly + 30, st, 15, SANS, INK, 600, "middle"));
    });
  } else {
    if (L.ic) out.push(placeIcon(L.ic, L.left, y + L.topPad + (h - L.topPad - L.isz) / 2, L.isz));
    let yy = L.y0;
    const nameColor = shape === "decision" ? NAVY : txt;
    for (const s of L.names) {
      const mono = isMono(s);
      out.push(T(L.tx, yy, s, mono ? NAME - 1 : NAME, mono ? MONO : SANS, nameColor, mono ? 500 : 600, L.anchor)); yy += 22;
    }
    for (const s of L.subs) { out.push(T(L.tx, yy, s, SUB, SANS, txt === PAPER ? PAPER : SOFT, 400, L.anchor)); yy += 18; }
  }
  return out.join("");
}

const EDGE_COLOR = { solid: BLUE, dashed: BLUE, deny: DENY, link: LINK, navy: NAVY, final: NAVY, built: BUILT };
const EDGE_LABEL_COLOR = { solid: LINK, dashed: LINK, deny: DENY, link: LINK, navy: NAVY, final: NAVY, built: BUILT };

function labelBoxes(e) {
  if (!e.label || !e.at) return [];
  const [x, y] = e.at;
  return e.label.split("\n").map((s, i) => {
    const w = tw(s, ALAB, "caps") + 12;
    const rx = (e.lpos === "above" || e.lpos === "below") ? x - w / 2 : (e.lpos === "right" ? x - 6 : x - w + 6);
    return [rx, y + i * 19 - ALAB - 1, w, ALAB + 7];
  });
}

function svgEdge(e, uid) {
  const pts = e.pts, color = EDGE_COLOR[e.style] || BLUE;
  const dash = ["dashed", "deny", "built"].includes(e.style) ? ' stroke-dasharray="7 5"' : "";
  const markerName = { final: "arrn", built: "arrb" }[e.style] || "arr";
  const me = e.end && e.style !== "deny" ? ` marker-end="url(#${uid}-${markerName})"` : "";
  const ms = e.start ? ` marker-start="url(#${uid}-arrs)"` : "";
  const width = { deny: 2.2, final: 3 }[e.style] || 1.8;
  const out = [`<path d="${roundedPath(pts)}" fill="none" stroke="${color}" stroke-width="${width}"${dash}${me}${ms}/>`];
  if (e.style === "deny") {
    const [xa, ya] = pts[pts.length - 2], [xb, yb] = pts[pts.length - 1];
    if (xa === xb) out.push(`<line x1="${xb - 16}" y1="${yb}" x2="${xb + 16}" y2="${yb}" stroke="${DENY}" stroke-width="5"/>`);
    else out.push(`<line x1="${xb}" y1="${yb - 16}" x2="${xb}" y2="${yb + 16}" stroke="${DENY}" stroke-width="5"/>`);
    const [mx, my] = e.xat || [(xa + xb) / 2, (ya + yb) / 2];
    out.push(`<circle cx="${mx}" cy="${my}" r="12" fill="${PAPER}" stroke="${DENY}" stroke-width="2.2"/>` +
             `<path d="M${mx - 5.5},${my - 5.5} L${mx + 5.5},${my + 5.5} M${mx + 5.5},${my - 5.5} L${mx - 5.5},${my + 5.5}" stroke="${DENY}" stroke-width="2.6"/>`);
  }
  return out.join("");
}

function svgEdgeLabel(e) {
  const color = EDGE_LABEL_COLOR[e.style] || LINK;
  return labelBoxes(e).map(([bx, by, bw, bh], i) =>
    `<rect x="${r0(bx)}" y="${r0(by)}" width="${r0(bw)}" height="${bh}" fill="${PAPER}"/>` +
    T(bx + 6, by + ALAB + 1, e.label.split("\n")[i].toUpperCase(), ALAB, COND, color, 600, "start", "0.04em")).join("");
}

function gateBox(g) {
  if (!g.label) return [g.x - GR, g.y - GR, 2 * GR, 2 * GR];
  const lines = g.label.split("\n");
  const wmax = Math.max(...lines.map(s => tw(s, GLAB, "sans"))) + (g.icon ? 32 : 0);
  const hgt = lines.length * 20;
  let lx, ly;
  if (g.side === "above") { lx = g.x - wmax / 2; ly = g.y - GR - 14 - hgt; }
  else if (g.side === "below") { lx = g.x - wmax / 2; ly = g.y + GR + 14; }
  else if (g.side === "right") { lx = g.x + GR + 14; ly = g.y - hgt / 2; }
  else { lx = g.x - GR - 14 - wmax; ly = g.y - hgt / 2; }
  return [lx - 8, ly - 5, wmax + 16, hgt + 10];
}

function svgGate(g) {
  const { x, y, n } = g, r = GR;
  const out = [`<path d="M${x},${y - r} L${x + r},${y} L${x},${y + r} L${x - r},${y} Z" fill="${NAVY}" stroke="${PAPER}" stroke-width="3"/>`,
               T(x, y + 10, String(n), 30, COND, PAPER, 700, "middle")];
  if (!g.label) return out.join("");
  const [bx, by, bw, bh] = gateBox(g);
  out.push(`<rect x="${r0(bx)}" y="${r0(by)}" width="${r0(bw)}" height="${bh}" rx="3" fill="${PAPER}" stroke="${NAVY}" stroke-width="1.2"/>`);
  let tx = bx + 8;
  if (g.icon) { out.push(placeIcon(g.icon, tx, by + (bh - 26) / 2, 26)); tx += 32; }
  g.label.split("\n").forEach((s, i) => out.push(T(tx, by + 5 + 16 + i * 20, s, GLAB, SANS, NAVY, 600)));
  return out.join("");
}

function svgText(t) {
  const role = t.role, s = t.s || "";
  if (role === "title") return T(t.x, t.y, s.toUpperCase(), 28, COND, NAVY, 700, t.anchor, "0.05em");
  if (role === "subtitle") return T(t.x, t.y, s, 16, SANS, SOFT, 400, t.anchor);
  if (role === "eyebrow") return T(t.x, t.y, s.toUpperCase(), 14, COND, t.color || SOFT, 700, t.anchor, "0.08em");
  if (role === "label") {
    return s.split("\n").map((line, i) => {
      const yy = t.y + i * 19, wd = tw(line, ALAB, "caps");
      const x0 = t.x - (t.anchor === "middle" ? wd / 2 : (t.anchor === "end" ? wd : 0));
      return `<rect x="${r0(x0 - 4)}" y="${yy - ALAB - 1}" width="${r0(wd + 8)}" height="${ALAB + 6}" fill="${PAPER}"/>` +
             T(t.x, yy, line.toUpperCase(), ALAB, COND, t.color || LINK, 600, t.anchor, "0.04em");
    }).join("");
  }
  if (role === "heading") {
    if (t.icon) return placeIcon(t.icon, t.x, t.y - 21, 28) + svgText({ ...t, icon: null, x: t.x + 36 });
    return s.split("\n").map((line, i) => T(t.x, t.y + i * 22, line, 17, SANS, t.color || INK, 600, t.anchor)).join("");
  }
  if (role === "gatenote") return T(t.x, t.y, s, GLAB + 2, SANS, NAVY, 700, t.anchor);
  if (role === "mono") return T(t.x, t.y, s, 14, MONO, t.color || INK, 400, t.anchor);
  return s.split("\n").map((line, i) => T(t.x, t.y + i * 19, line, 15, SANS, t.color || SOFT, 500, t.anchor, null, true)).join("");
}

function autoLegend(b) {
  const items = [];
  if (b.gates.length) items.push(["gate", "AWS permission gate (1–6)"]);
  if (b.edges.some(e => e.style === "deny")) items.push(["deny", "Denied path"]);
  items.push(["flow", "Data / request"]);
  if (b.edges.some(e => e.style === "dashed")) items.push(["dashed", "Conditional / return"]);
  if (b.edges.some(e => e.style === "built")) items.push(["built", "Built from"]);
  if (b.edges.some(e => e.style === "final")) items.push(["final", "Final query + answer"]);
  if (b.nodes.some(n => n.shape === "decision")) items.push(["decision", "Decision"]);
  if (b.nodes.some(n => n.shape === "agent")) items.push(["agent", "Claim Query Agent"]);
  if (b.nodes.some(n => n.shape === "db")) items.push(["store", "Data store / prefix"]);
  if (b.zones.some(z => z.kind === "phi")) items.push(["phi", "Customer B boundary"]);
  return items;
}

function svgLegend(b, uid) {
  const items = b.legend_items || autoLegend(b);
  const y = b.h - 34;
  const out = [`<line x1="40" y1="${y - 26}" x2="${b.w - 40}" y2="${y - 26}" stroke="${LINE}" stroke-width="1"/>`,
               T(40, y + 5, "LEGEND", 13, COND, SOFT, 700, "start", "0.12em")];
  let x = 120;
  for (const [k, lab] of items) {
    let off = 46;
    if (k === "gate") { out.push(`<path d="M${x + 12},${y - 12} L${x + 24},${y} L${x + 12},${y + 12} L${x},${y} Z" fill="${NAVY}"/>`); off = 34; }
    else if (k === "deny") { out.push(`<line x1="${x}" y1="${y}" x2="${x + 34}" y2="${y}" stroke="${DENY}" stroke-width="2" stroke-dasharray="7 5"/><line x1="${x + 36}" y1="${y - 9}" x2="${x + 36}" y2="${y + 9}" stroke="${DENY}" stroke-width="4"/>`); off = 48; }
    else if (k === "flow") out.push(`<line x1="${x}" y1="${y}" x2="${x + 34}" y2="${y}" stroke="${BLUE}" stroke-width="1.6" marker-end="url(#${uid}-arr)"/>`);
    else if (k === "built") out.push(`<line x1="${x}" y1="${y}" x2="${x + 34}" y2="${y}" stroke="${BUILT}" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#${uid}-arrb)"/>`);
    else if (k === "final") { out.push(`<line x1="${x}" y1="${y}" x2="${x + 34}" y2="${y}" stroke="${NAVY}" stroke-width="3" marker-end="url(#${uid}-arrn)"/>`); off = 50; }
    else if (k === "dashed") out.push(`<line x1="${x}" y1="${y}" x2="${x + 34}" y2="${y}" stroke="${BLUE}" stroke-width="1.6" stroke-dasharray="7 5" marker-end="url(#${uid}-arr)"/>`);
    else if (k === "phi") out.push(`<rect x="${x}" y="${y - 9}" width="34" height="18" fill="none" stroke="${NAVY}" stroke-width="1.6" stroke-dasharray="7 4"/>`);
    else if (k === "agent") out.push(`<path d="M${x + 7},${y - 10} H${x + 27} L${x + 34},${y} L${x + 27},${y + 10} H${x + 7} L${x},${y} Z" fill="${NAVY}"/>`);
    else if (k === "decision") { out.push(`<path d="M${x + 12},${y - 12} L${x + 24},${y} L${x + 12},${y + 12} L${x},${y} Z" fill="${PAPER}" stroke="${NAVY}" stroke-width="1.6"/>`); off = 34; }
    else if (k === "service") out.push(`<rect x="${x}" y="${y - 9}" width="34" height="18" fill="${TINT}" stroke="${BLUE}" stroke-width="1.2"/>`);
    else if (k === "store") { out.push(cylinder(x + 4, y - 12, 24, 24, TINT, BLUE, 1.2)); off = 38; }
    else if (k === "badge") { out.push(`<circle cx="${x + 10}" cy="${y}" r="10" fill="${BLUE}"/>`); off = 30; }
    else if (k === "external") out.push(`<rect x="${x}" y="${y - 9}" width="34" height="18" fill="${PAPER}" stroke="#7A7F88" stroke-width="1.2" stroke-dasharray="5 4"/>`);
    out.push(T(x + off, y + 5, lab, 14, SANS, INK, 500));
    x += off + tw(lab, 14, "sans") + 40;
  }
  return out.join("");
}

function markerDefs(uid) {
  return `<marker id="${uid}-arr" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="${BLUE}"/></marker>` +
         `<marker id="${uid}-arrs" markerWidth="10" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M10,0 L0,4 L10,8 Z" fill="${BLUE}"/></marker>` +
         `<marker id="${uid}-arrb" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L11,4.5 L0,9 Z" fill="${BUILT}"/></marker>` +
         `<marker id="${uid}-arrn" markerWidth="13" markerHeight="11" refX="12" refY="5.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L13,5.5 L0,11 Z" fill="${NAVY}"/></marker>`;
}

function boardToSvg(b, fontCss) {
  const uid = (b.slug || "board").replace(/[^\w-]/g, "");
  const parts = [`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${b.w} ${b.h}" width="${b.w}" height="${b.h}" role="img" aria-labelledby="${uid}-title ${uid}-desc">`,
                 `<title id="${uid}-title">${esc(b.title || "")}</title><desc id="${uid}-desc">${esc(b.desc || "")}</desc>`,
                 `<style>${fontCss ?? `@import url('${FONTS_URL.replace(/&/g, "&amp;")}');`}</style>`,
                 `<defs>${markerDefs(uid)}</defs>`, `<rect width="100%" height="100%" fill="${PAPER}"/>`];
  parts.push(...b.zones.map(svgZone), ...b.edges.map(e => svgEdge(e, uid)), ...b.nodes.map(svgNode), ...b.edges.map(svgEdgeLabel),
             ...b.gates.map(svgGate), ...b.texts.map(svgText));
  if (b.show_legend !== false) parts.push(svgLegend(b, uid));
  parts.push("</svg>");
  return parts.join("\n");
}

    zone.x = snap(cx - zone.w / 2); zone.y = snap(cy - zone.h / 2);
    b.zones.push(zone); item = zone;
  } else if (spec.kind === "gate") {
    const [label, icon] = GATE_DEFAULTS[spec.n];
    const gate = { id: nextId("gate"), n: spec.n, label, icon, side: "above", x: snap(cx), y: snap(cy) };
    snapGateToEdge(gate);
    b.gates.push(gate); item = gate;
  } else if (spec.kind === "text") {
    const defaults = { title: "00 · Board title", subtitle: "One line that says what this board shows.", eyebrow: "Section",
                       heading: "Heading", label: "Arrow label", note: "A short note beside the arrow it explains.",
                       gatenote: "Gate 6 · IAM + KMS", mono: "customer_b/raw/" };
    const text = { id: nextId("text"), role: spec.role, s: defaults[spec.role], anchor: "start", color: null, x: snap(cx - 80), y: snap(cy) };
    b.texts.push(text); item = text;
  }
  state.selection = new Set([item.id]);
  changed();
  renderInspector();
  if (spec.shape === "image") $("fileImage").click();
}

function snapGateToEdge(gate) {
  const reach = 18 / state.view.z;
  let best = null;
  for (const e of state.board.edges) {
    for (let i = 0; i < e.pts.length - 1; i++) {
      const [a, b] = [e.pts[i], e.pts[i + 1]];
      let p;
      if (a[1] === b[1]) p = [Math.min(Math.max(gate.x, Math.min(a[0], b[0])), Math.max(a[0], b[0])), a[1]];
      else if (a[0] === b[0]) p = [a[0], Math.min(Math.max(gate.y, Math.min(a[1], b[1])), Math.max(a[1], b[1]))];
      else continue;
      const d = Math.hypot(p[0] - gate.x, p[1] - gate.y);
      if (d <= reach && (!best || d < best.d)) best = { d, p };
    }
  }
  if (best) { gate.x = Math.round(best.p[0]); gate.y = Math.round(best.p[1]); }
}

/* =================================================================================================================
   Pointer interaction
   ================================================================================================================= */
function nodeAt(p, excludeIds = new Set()) {
  const nodes = state.board.nodes;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (excludeIds.has(n.id)) continue;
    if (p[0] >= n.x - 6 && p[0] <= n.x + n.w + 6 && p[1] >= n.y - 6 && p[1] <= n.y + n.h + 6) return n;
  }
  return null;
}
/* Where an arrow end lands on a node: the nearest border point (snapped to a side's middle when close to it), or,
   when dropped well inside the node, the middle of the side that faces the arrow's other end. */
function anchorOn(n, p, from) {
  const tol = 14 / state.view.z;
  const deep = p[0] > n.x + tol && p[0] < n.x + n.w - tol && p[1] > n.y + tol && p[1] < n.y + n.h - tol;
  if (deep && from) {
    const dx = from[0] - (n.x + n.w / 2), dy = from[1] - (n.y + n.h / 2);
    if (Math.abs(dx) / n.w >= Math.abs(dy) / n.h) return { id: n.id, fx: dx < 0 ? 0 : 1, fy: 0.5 };
    return { id: n.id, fx: 0.5, fy: dy < 0 ? 0 : 1 };
  }
  const cands = [
    ["L", n.x, Math.min(Math.max(p[1], n.y), n.y + n.h)], ["R", n.x + n.w, Math.min(Math.max(p[1], n.y), n.y + n.h)],
    ["T", Math.min(Math.max(p[0], n.x), n.x + n.w), n.y], ["B", Math.min(Math.max(p[0], n.x), n.x + n.w), n.y + n.h],
  ];
  let best = cands[0], bd = Infinity;
  for (const c of cands) { const d = Math.hypot(c[1] - p[0], c[2] - p[1]); if (d < bd) { bd = d; best = c; } }
  let [side, x, y] = best;
  if (side === "L" || side === "R") { if (Math.abs(y - (n.y + n.h / 2)) < tol) y = n.y + n.h / 2; else y = Math.round(y); }
  else { if (Math.abs(x - (n.x + n.w / 2)) < tol) x = n.x + n.w / 2; else x = Math.round(x); }
  return { id: n.id, fx: (x - n.x) / n.w, fy: (y - n.y) / n.h };
}

svg.addEventListener("pointerdown", evt => {
  if (evt.button === 2) return;
  svg.setPointerCapture(evt.pointerId);
  const p = boardPoint(evt);
  if (evt.button === 1 || state.spaceDown) {
    state.drag = { type: "pan", client: [evt.clientX, evt.clientY], view: { ...state.view } };
    stage.classList.add("panning");
    return;
  }
  const handle = evt.target.closest("[data-handle]");
  if (handle) { startHandleDrag(handle.dataset.handle, p, evt); return; }
  if (state.tool === "arrow") {
    const n = nodeAt(p);
    state.drag = { type: "newEdge", startNode: n, origin: p, start: n ? null : [snap(p[0]), snap(p[1])], src: null, now: p, preview: null };
    return;
  }
  const hit = evt.target.closest("[data-id]");
  if (hit && world.contains(hit)) {
    const id = hit.dataset.id;
    if (evt.shiftKey) {
      if (state.selection.has(id)) state.selection.delete(id); else state.selection.add(id);
      renderSelection(); renderInspector();
      if (!state.selection.has(id)) return;
    } else if (!state.selection.has(id)) {
      state.selection = new Set([id]); renderInspector();
    }
    if (hit.dataset.part === "label" && state.selection.size === 1) { startHandleDrag("label", p, evt); return; }
    startMove(p, evt);
    renderSelection();
    return;
  }
  if (!evt.shiftKey) state.selection.clear();
  state.drag = { type: "marquee", start: p, now: p, additive: evt.shiftKey };
  renderSelection(); renderInspector();
});

function startMove(p, evt) {
  const ids = new Set(state.selection);
  if (!evt.altKey) {
    for (const id of state.selection) {
      const it = findItem(id);
      if (it && it.kind === "zone") {
        const zb = itemBox(it);
        for (const other of allItems()) if (other.el.id !== id && contains(zb, itemBox(other))) ids.add(other.el.id);
      }
    }
  }
  const movedNodes = new Set(state.board.nodes.filter(n => ids.has(n.id)).map(n => n.id));
  const edgesWhole = [], edgesEnds = [];
  for (const e of state.board.edges) {
    const srcMoves = e.src && movedNodes.has(e.src.id), dstMoves = e.dst && movedNodes.has(e.dst.id);
    if (ids.has(e.id) || ((srcMoves || !e.src) && (dstMoves || !e.dst) && (srcMoves || dstMoves))) edgesWhole.push(e.id);
    else if (srcMoves || dstMoves) edgesEnds.push(e.id);
  }
  state.drag = { type: "move", start: p, ids, edgesWhole: new Set(edgesWhole), edgesEnds: new Set(edgesEnds),
                 original: clone(state.board), moved: false };
}

function startHandleDrag(handle, p, evt) {
  const id = [...state.selection][0];
  state.drag = { type: "handle", handle, start: p, id, original: clone(state.board), moved: false };
  if (handle.startsWith("seg:")) {
    const e = state.board.edges.find(x => x.id === id);
    let i = Number(handle.slice(4));
    if (i === 0) { e.pts.unshift([...e.pts[0]]); i++; }
    if (i + 1 === e.pts.length - 1) e.pts.push([...e.pts[e.pts.length - 1]]);
    state.drag.segment = i;
    state.drag.segPts = clone(e.pts);
  }
}

svg.addEventListener("pointermove", evt => {
  const d = state.drag;
  if (!d) return;
  const p = boardPoint(evt);
  d.now = p;
  if (d.type === "pan") {
    state.view.x = d.view.x - (evt.clientX - d.client[0]) / state.view.z;
    state.view.y = d.view.y - (evt.clientY - d.client[1]) / state.view.z;
    applyView();
  } else if (d.type === "marquee") {
    renderSelection();
  } else if (d.type === "newEdge") {
    const n = nodeAt(p, new Set(d.startNode ? [d.startNode.id] : []));
    const fromPoint = d.startNode ? [d.startNode.x + d.startNode.w / 2, d.startNode.y + d.startNode.h / 2] : d.start;
    d.snapTarget = n ? anchorOn(n, p, fromPoint) : null;
    const end = d.snapTarget ? bindingPoint(d.snapTarget) : [snap(p[0], evt.altKey), snap(p[1], evt.altKey)];
    if (d.startNode) { d.src = anchorOn(d.startNode, d.origin, end); d.start = bindingPoint(d.src); }
    d.preview = { pts: cleanPoints(route(d.start, end, sideOf(d.src), sideOf(d.snapTarget))), style: state.arrowStyle, end: true, start: false };
    renderSelection();
  } else if (d.type === "move") {
    dragMove(d, p, evt);
  } else if (d.type === "handle") {
    dragHandle(d, p, evt);
  }
});

function dragMove(d, p, evt) {
  if (!d.moved) { state.undo.push(JSON.stringify(d.original)); state.redo = []; d.moved = true; }
  let dx = p[0] - d.start[0], dy = p[1] - d.start[1];
  if (!evt.altKey && state.snap) { dx = Math.round(dx / 10) * 10; dy = Math.round(dy / 10) * 10; }
  const b = state.board, o = d.original;
  const touched = new Set();
  for (const coll of ["zones", "nodes", "gates", "texts"]) {
    b[coll].forEach((el, i) => {
      if (!d.ids.has(el.id)) return;
      el.x = o[coll][i].x + dx; el.y = o[coll][i].y + dy; touched.add(el.id);
    });
  }
  if (d.ids.size === 1) {
    const only = b.gates.find(g => d.ids.has(g.id));
    if (only && !evt.altKey) snapGateToEdge(only);
  }
  b.edges.forEach((e, i) => {
    const oe = o.edges[i];
    if (d.edgesWhole.has(e.id)) {
      e.pts = oe.pts.map(([x, y]) => [x + dx, y + dy]);
      if (oe.at) e.at = [oe.at[0] + dx, oe.at[1] + dy];
      if (oe.xat) e.xat = [oe.xat[0] + dx, oe.xat[1] + dy];
      touched.add(e.id);
    } else if (d.edgesEnds.has(e.id)) {
      e.pts = clone(oe.pts);
      refreshEdgeEnds(e, e.src && d.ids.has(e.src.id), e.dst && d.ids.has(e.dst.id));
      touched.add(e.id);
    }
  });
  rerender(touched);
}

function dragHandle(d, p, evt) {
  if (!d.moved) { state.undo.push(JSON.stringify(d.original)); state.redo = []; d.moved = true; }
  const b = state.board, free = evt.altKey;
  const it = findItem(d.id);
  if (!it) return;
  const touched = new Set([d.id]);
  if (d.handle.startsWith("resize:")) {
    const k = d.handle.slice(7), o = d.original[COLLECTION[it.kind]].find(x => x.id === d.id);
    let { x, y, w, h } = o;
    const px = snap(p[0], free), py = snap(p[1], free), min = it.kind === "node" && it.el.shape === "badge" ? 16 : 30;
    if (k.includes("e")) w = Math.max(min, px - x);
    if (k.includes("s")) h = Math.max(min, py - y);
    if (k.includes("w")) { const nx = Math.min(px, x + w - min); w = x + w - nx; x = nx; }
    if (k.includes("n")) { const ny = Math.min(py, y + h - min); h = y + h - ny; y = ny; }
    Object.assign(it.el, { x, y, w, h });
    if (it.kind === "node") {
      b.edges.forEach((e, i) => {
        const srcHit = e.src && e.src.id === d.id, dstHit = e.dst && e.dst.id === d.id;
        if (!srcHit && !dstHit) return;
        e.pts = clone(d.original.edges[i].pts);
        refreshEdgeEnds(e, srcHit, dstHit);
        touched.add(e.id);
      });
    }
  } else if (d.handle.startsWith("end:")) {
    const atStart = d.handle === "end:start", e = it.el;
    const n = nodeAt(p);
    const oe0 = d.original.edges.find(x => x.id === d.id);
    d.snapTarget = n ? anchorOn(n, p, atStart ? oe0.pts[oe0.pts.length - 1] : oe0.pts[0]) : null;
    const target = d.snapTarget ? bindingPoint(d.snapTarget) : [snap(p[0], free), snap(p[1], free)];
    const oe = d.original.edges.find(x => x.id === d.id);
    e.pts = clone(oe.pts);
    if (atStart) e.src = d.snapTarget; else e.dst = d.snapTarget;
    const other = atStart ? e.pts[e.pts.length - 1] : e.pts[0];
    if (e.pts.length <= 3) e.pts = atStart ? route(target, other, sideOf(e.src), sideOf(e.dst)) : route(other, target, sideOf(e.src), sideOf(e.dst));
    else moveEdgeEnd(e, atStart, target);
  } else if (d.handle.startsWith("seg:")) {
    const e = it.el, i = d.segment;
    e.pts = clone(d.segPts);
    const [a, c] = [e.pts[i], e.pts[i + 1]];
    if (a[1] === c[1]) { const ny = snap(p[1], free); a[1] = ny; c[1] = ny; }
    else { const nx = snap(p[0], free); a[0] = nx; c[0] = nx; }
  } else if (d.handle === "label") {
    it.el.at = [snap(p[0], free), snap(p[1], free)];
  }
  rerender(touched);
}

svg.addEventListener("pointerup", evt => {
  const d = state.drag;
  state.drag = null;
  stage.classList.remove("panning");
  if (!d) return;
  if (d.type === "marquee") {
    const r = rectFrom(d.start, d.now);
    if (r[2] > 3 || r[3] > 3) for (const it of allItems()) if (contains(r, itemBox(it))) state.selection.add(it.el.id);
    renderSelection(); renderInspector();
  } else if (d.type === "newEdge") {
    if (d.preview && Math.hypot(d.now[0] - d.start[0], d.now[1] - d.start[1]) > 8) {
      checkpoint();
      const e = { id: nextId("edge"), pts: d.preview.pts, label: null, at: null, style: state.arrowStyle, end: true, start: false,
                  lpos: "above", src: d.src, dst: d.snapTarget };
      state.board.edges.push(e);
      state.selection = new Set([e.id]);
      changed(); renderInspector();
    } else renderSelection();
  } else if (d.type === "handle" || d.type === "move") {
    if (d.type === "handle" && (d.handle.startsWith("seg:") || d.handle.startsWith("end:"))) {
      const e = state.board.edges.find(x => x.id === d.id);
      if (e) e.pts = cleanPoints(e.pts);
    }
    if (d.moved) changed(); else renderSelection();
    renderInspector();
  }
});

svg.addEventListener("dblclick", evt => {
  const hit = evt.target.closest("[data-id]");
  if (!hit) return;
  state.selection = new Set([hit.dataset.id]);
  renderSelection(); renderInspector();
  const first = $("inspector").querySelector("[data-focus]");
  if (first) { first.focus(); first.select && first.select(); }
});

svg.addEventListener("wheel", evt => {
  evt.preventDefault();
  if (evt.ctrlKey || evt.metaKey) zoomAt(Math.exp(-evt.deltaY * 0.0025), evt.clientX, evt.clientY);
  else { state.view.x += evt.deltaX / state.view.z; state.view.y += evt.deltaY / state.view.z; applyView(); }
}, { passive: false });
svg.addEventListener("contextmenu", evt => evt.preventDefault());

/* =================================================================================================================
   Keyboard
   ================================================================================================================= */
const typing = () => { const a = document.activeElement; return a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA" || a.tagName === "SELECT"); };
document.addEventListener("keydown", evt => {
  if (evt.code === "Space" && !typing()) { state.spaceDown = true; evt.preventDefault(); return; }
  if (typing()) { if (evt.key === "Escape") document.activeElement.blur(); return; }
  const mod = evt.ctrlKey || evt.metaKey, k = evt.key.toLowerCase();
  if (mod && k === "z") { evt.preventDefault(); evt.shiftKey ? redo() : undo(); }
  else if (mod && k === "y") { evt.preventDefault(); redo(); }
  else if (mod && k === "a") { evt.preventDefault(); state.selection = new Set(allItems().map(it => it.el.id)); renderSelection(); renderInspector(); }
  else if (mod && k === "c") { copySelection(); }
  else if (mod && k === "v") { evt.preventDefault(); paste(); }
  else if (mod && k === "d") { evt.preventDefault(); copySelection(); paste(); }
  else if (mod && k === "s") { evt.preventDefault(); saveJson(); }
  else if (k === "delete" || k === "backspace") { evt.preventDefault(); deleteSelection(); }
  else if (k === "escape") { setTool("select"); state.selection.clear(); renderSelection(); renderInspector(); }
  else if (k === "v" && !mod) setTool("select");
  else if (k === "a" && !mod) setTool("arrow");
  else if (k === "f" && !mod) fitView();
  else if (evt.key.startsWith("Arrow") && state.selection.size) {
    evt.preventDefault();
    const step = evt.shiftKey ? 10 : 1;
    const dx = { ArrowLeft: -step, ArrowRight: step }[evt.key] || 0, dy = { ArrowUp: -step, ArrowDown: step }[evt.key] || 0;
    nudge(dx, dy);
  }
});
document.addEventListener("keyup", evt => { if (evt.code === "Space") state.spaceDown = false; });

function nudge(dx, dy) {
  checkpoint();
  nudgeWithoutCheckpoint(dx, dy);
  persist(); renderInspector();
}

function deleteSelection() {
  if (!state.selection.size) return;
  checkpoint();
  const b = state.board, gone = state.selection;
  for (const coll of Object.values(COLLECTION)) b[coll] = b[coll].filter(el => !gone.has(el.id));
  for (const e of b.edges) { if (e.src && gone.has(e.src.id)) e.src = null; if (e.dst && gone.has(e.dst.id)) e.dst = null; }
  state.selection = new Set();
  changed(); renderInspector();
}
function copySelection() {
  if (!state.selection.size) return;
  state.clipboard = allItems().filter(it => state.selection.has(it.el.id)).map(it => ({ kind: it.kind, el: clone(it.el) }));
  toast(`Copied ${state.clipboard.length} item${state.clipboard.length > 1 ? "s" : ""}`);
}
function paste() {
  if (!state.clipboard) return;
  checkpoint();
  const b = state.board, idMap = {}, fresh = [];
  for (const { kind, el } of state.clipboard) {
    const copy = clone(el);
    copy.id = nextId(kind);
    idMap[el.id] = copy.id;
    b[COLLECTION[kind]].push(copy);
    fresh.push({ kind, el: copy });
  }
  for (const { kind, el } of fresh) {
    if (kind === "edge") {
      el.pts = el.pts.map(([x, y]) => [x + 30, y + 30]);
      if (el.at) el.at = [el.at[0] + 30, el.at[1] + 30];
      if (el.xat) el.xat = [el.xat[0] + 30, el.xat[1] + 30];
      el.src = el.src && idMap[el.src.id] ? { ...el.src, id: idMap[el.src.id] } : null;
      el.dst = el.dst && idMap[el.dst.id] ? { ...el.dst, id: idMap[el.dst.id] } : null;
    } else { el.x += 30; el.y += 30; }
  }
  state.clipboard = fresh.map(it => ({ kind: it.kind, el: clone(it.el) }));
  state.selection = new Set(fresh.map(it => it.el.id));
  changed(); renderInspector();
}

/* =================================================================================================================
   Inspector
   ================================================================================================================= */
const opt = (map, value) => Object.entries(map).map(([k, v]) => `<option value="${esc(k)}"${String(k) === String(value) ? " selected" : ""}>${esc(v)}</option>`).join("");
function iconPicker(field, value) {
  const buttons = [`<button type="button" class="none${value ? "" : " on"}" data-icon="">none</button>`];
  for (const name of ALL_ICONS) {
    buttons.push(`<button type="button" title="${esc(ICON_NAMES[name] || name)}" class="${value === name ? "on" : ""}" data-icon="${name}">` +
                 `<svg viewBox="-2 -2 28 28">${placeIcon(name, 0, 0, 24)}</svg></button>`);
  }
  return `<div class="icon-pick" data-field="${field}">${buttons.join("")}</div>`;
}
const field = (label, html) => `<label>${label}</label>${html}`;
const textInput = (k, v, focus) => `<input type="text" data-field="${k}" value="${esc(v ?? "")}"${focus ? " data-focus" : ""}>`;
const numInput = (k, v) => `<input type="number" data-field="${k}" value="${Math.round(v)}">`;
const area = (k, v, rows = 2, focus) => `<textarea data-field="${k}" rows="${rows}"${focus ? " data-focus" : ""}>${esc(v ?? "")}</textarea>`;
const geometry = el => `<div class="row4">${["x", "y", "w", "h"].map(k => `<div><label>${k.toUpperCase()}</label>${numInput(k, el[k])}</div>`).join("")}</div>`;
const orderButtons = `<div class="btns"><button data-act="front">Bring to front</button><button data-act="back">Send to back</button>` +
                     `<button data-act="duplicate">Duplicate</button><button data-act="delete" class="danger">Delete</button></div>`;

function innerAsText(n) {
  if (!n.inner) return "";
  if (n.shape === "table") return n.inner.map(r => r.join(" | ")).join("\n");
  if (n.shape === "grid") return n.inner.map(([i, l]) => `${i} | ${l}`).join("\n");
  return n.inner.join("\n");
}
function innerFromText(shape, s) {
  const rows = s.split("\n");
  if (shape === "table") return rows.filter(r => r.trim()).map(r => r.split("|").map(c => c.trim()));
  if (shape === "grid") return rows.filter(r => r.trim()).map(r => { const [i, ...l] = r.split("|"); return [i.trim(), l.join("|").trim()]; });
  if (shape === "steps") return rows.filter(r => r.trim());
  return rows;
}
const INNER_HELP = { code: "One line per row of code.", steps: "One step per line.", table: "One row per line, cells split by |. The first row is the header.",
                     grid: "One item per line: icon | label (icon names as in the picker's tooltips, e.g. role, kms, s3)." };

function renderInspector() {
  const box = $("inspector"), sel = [...state.selection];
  if (!sel.length) { box.innerHTML = boardInspector(); bindInspector(null); return; }
  if (sel.length > 1) { box.innerHTML = multiInspector(sel.length); bindInspector(null); return; }
  const it = findItem(sel[0]);
  if (!it) { box.innerHTML = boardInspector(); bindInspector(null); return; }
  const el = it.el;
  let html = "";
  if (it.kind === "node") {
    html += `<h2>${esc(SHAPES[el.shape] || "Shape")}</h2>`;
    if (el.shape !== "image") html += field(el.shape === "badge" ? "Number" : "Name (one line per row)", area("name", el.name, 2, true));
    if (!["image", "badge", "table", "grid"].includes(el.shape)) html += field("Qualifier (short)", area("sub", el.sub, 1));
    html += `<div class="row"><div>${field("Shape", `<select data-field="shape">${opt(SHAPES, el.shape)}</select>`)}</div>` +
            `<div>${field("Style", `<select data-field="style">${opt(NODE_STYLES, el.style)}</select>`)}</div></div>`;

function bindInspector(it) {
  const box = $("inspector");
  let checkpointed = false;
  const before = () => { if (!checkpointed) { checkpoint(); checkpointed = true; } };
  for (const input of box.querySelectorAll("[data-field]:not(.icon-pick)")) {
    input.addEventListener("focus", () => { checkpointed = false; });
    const evName = input.tagName === "SELECT" || input.type === "checkbox" ? "change" : "input";
    input.addEventListener(evName, () => { before(); applyField(it, input.dataset.field, input.type === "checkbox" ? input.checked : input.value); });
    if (input.tagName === "SELECT") input.addEventListener("change", () => { checkpointed = false; });
  }
  for (const picker of box.querySelectorAll(".icon-pick")) {
    picker.addEventListener("click", evt => {
      const btn = evt.target.closest("button[data-icon]");
      if (!btn) return;
      checkpoint();
      applyField(it, picker.dataset.field, btn.dataset.icon || null);
      picker.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === btn));
    });
  }
  for (const btn of box.querySelectorAll("[data-act]")) btn.addEventListener("click", () => inspectorAction(btn.dataset.act, it));
  for (const btn of box.querySelectorAll("[data-align]")) btn.addEventListener("click", () => alignSelection(btn.dataset.align));
}

function applyField(it, key, value) {
  if (!it) {
    const b = state.board;
    if (key === "w" || key === "h") b[key] = Math.max(200, Number(value) || b[key]);
    else b[key] = value;
    $("paper").setAttribute("width", b.w); $("paper").setAttribute("height", b.h);
    renderLegend(); persist(); refreshBoardPicker();
    return;
  }
  const el = it.el;
  const numeric = ["x", "y", "w", "h", "cols", "n"];
  if (numeric.includes(key)) { const v = Number(value); if (!Number.isFinite(v)) return; el[key] = v; }
  else if (key === "inner") el.inner = innerFromText(el.shape, value);
  else if (key === "badge") { const [g, ...l] = value.split("|"); el.badge = value.trim() ? [g.trim(), l.join("|").trim()] : null; }
  else if (key === "color") el.color = value.trim() || null;
  else el[key] = value === "" && ["label", "sub", "icon"].includes(key) ? null : value;
  const touched = new Set([el.id]);
  if (it.kind === "node" && key === "shape") {
    const d = shapeDefaults(value);
    if (["code", "table", "steps", "grid"].includes(value) && !Array.isArray(el.inner)) el.inner = d.inner;
    if (value === "table" && !el.colw) el.colw = d.colw;
    renderInspector();
  }
  if (it.kind === "gate" && key === "n") {
    const [label, icon] = GATE_DEFAULTS[el.n];
    if (Object.values(GATE_DEFAULTS).some(([l]) => l === el.label) || !el.label) { el.label = label; el.icon = icon; renderInspector(); }
  }
  if (it.kind === "edge" && key === "label" && el.label && !el.at) el.at = defaultLabelPosition(el);
  if (it.kind === "node" && ["x", "y", "w", "h"].includes(key)) {
    for (const e of state.board.edges) {
      const s = e.src && e.src.id === el.id, d = e.dst && e.dst.id === el.id;
      if (s || d) { refreshEdgeEnds(e, s, d); e.pts = cleanPoints(e.pts); touched.add(e.id); }
    }
  }
  rerender(touched);
  persist();
}

function inspectorAction(act, it) {
  const b = state.board;
  if (act === "delete") return deleteSelection();
  if (act === "duplicate") { copySelection(); return paste(); }
  if (act === "image") return $("fileImage").click();
  if (act === "fitBoard") {
    checkpoint();
    const boxes = allItems().map(itemBox);
    if (!boxes.length) return;
    const minX = Math.min(...boxes.map(r => r[0])), minY = Math.min(...boxes.map(r => r[1]));
    const maxX = Math.max(...boxes.map(r => r[0] + r[2])), maxY = Math.max(...boxes.map(r => r[1] + r[3]));
    const dx = 40 - Math.min(40, minX), dy = 40 - Math.min(40, minY);
    if (dx || dy) { state.selection = new Set(allItems().map(i => i.el.id)); nudgeWithoutCheckpoint(dx, dy); state.selection = new Set(); }
    b.w = Math.ceil((maxX + dx + 40) / 10) * 10; b.h = Math.ceil((maxY + dy + (b.show_legend ? 110 : 40)) / 10) * 10;
    changed(); renderInspector(); return;
  }
  if (act === "distH" || act === "distV") return distribute(act === "distH");
  if (!it) return;
  checkpoint();
  const arr = b[COLLECTION[it.kind]];
  if (act === "front" || act === "back") {
    arr.splice(arr.indexOf(it.el), 1);
    if (act === "front") arr.push(it.el); else arr.unshift(it.el);
    changed();
  } else if (act === "reroute") {
    const e = it.el;
    e.pts = cleanPoints(route(e.pts[0], e.pts[e.pts.length - 1], sideOf(e.src), sideOf(e.dst)));
    changed([e.id]);
  } else if (act === "reverse") {
    const e = it.el;
    e.pts.reverse(); [e.src, e.dst] = [e.dst, e.src]; [e.start, e.end] = [e.end, e.start];
    changed([e.id]); renderInspector();
  }
}
function nudgeWithoutCheckpoint(dx, dy) {
  startMove([0, 0], { altKey: true });
  const d = state.drag; state.drag = null; d.moved = true;
  dragMove(d, [dx, dy], { altKey: true });
}
function alignSelection(mode) {
  const items = [...state.selection].map(findItem).filter(it => it && it.kind !== "edge");
  if (items.length < 2) return;
  checkpoint();
  const boxes = items.map(itemBox);
  const minX = Math.min(...boxes.map(r => r[0])), maxX = Math.max(...boxes.map(r => r[0] + r[2]));
  const minY = Math.min(...boxes.map(r => r[1])), maxY = Math.max(...boxes.map(r => r[1] + r[3]));
  const selection = state.selection;
  items.forEach((it, i) => {
    const [x, y, w, h] = boxes[i];
    const target = { left: [minX, y], right: [maxX - w, y], hcenter: [(minX + maxX) / 2 - w / 2, y],
                     top: [x, minY], bottom: [x, maxY - h], vcenter: [x, (minY + maxY) / 2 - h / 2] }[mode];
    state.selection = new Set([it.el.id]);
    nudgeWithoutCheckpoint(Math.round(target[0] - x), Math.round(target[1] - y));
  });
  state.selection = selection;
  changed(); renderInspector();
}
function distribute(horizontal) {
  const items = [...state.selection].map(findItem).filter(it => it && it.kind !== "edge");
  if (items.length < 3) return toast("Select three or more shapes to distribute.");
  checkpoint();
  const k = horizontal ? 0 : 1, sizeK = horizontal ? 2 : 3;
  const sorted = items.map(it => ({ it, box: itemBox(it) })).sort((a, b) => a.box[k] - b.box[k]);
  const first = sorted[0].box, last = sorted[sorted.length - 1].box;
  const total = sorted.reduce((s, x) => s + x.box[sizeK], 0);
  const gap = (last[k] + last[sizeK] - first[k] - total) / (sorted.length - 1);
  const selection = state.selection;
  let pos = first[k];
  for (const { it, box } of sorted) {
    state.selection = new Set([it.el.id]);
    const delta = Math.round(pos - box[k]);
    nudgeWithoutCheckpoint(horizontal ? delta : 0, horizontal ? 0 : delta);
    pos += box[sizeK] + gap;
  }
  state.selection = selection;
  changed(); renderInspector();
}

$("fileImage").addEventListener("change", evt => {
  const file = evt.target.files[0];
  evt.target.value = "";
  const it = state.selection.size === 1 ? findItem([...state.selection][0]) : null;
  if (!file || !it || it.kind !== "node") return;
  const reader = new FileReader();
  reader.onload = () => { checkpoint(); it.el.href = reader.result; it.el.shape = "image"; changed([it.el.id]); renderInspector(); };
  reader.readAsDataURL(file);
});

function previewSvg(spec) {
  if (spec.kind === "node") {
    const n = { id: "p", shape: spec.shape, style: spec.style || "service", icon: null, sub: null, inner: null, ...shapeDefaults(spec.shape), ...spec.props, x: 0, y: 0 };
    if (spec.preview) Object.assign(n, spec.preview);
    return `<svg viewBox="${-6} ${-6} ${n.w + 12} ${n.h + 12}" preserveAspectRatio="xMidYMid meet">${svgNode(n)}</svg>`;
  }
  if (spec.kind === "zone") {
    const z = { kind: spec.zoneKind, label: ZONE_KINDS[spec.zoneKind], icon: ZONE_ICONS[spec.zoneKind] || null, x: 0, y: 0, w: 300, h: 130 };
    return `<svg viewBox="-4 -4 308 138" preserveAspectRatio="xMidYMid meet">${svgZone(z)}</svg>`;
  }
  if (spec.kind === "gate") {
    return `<svg viewBox="-40 -40 80 80">${svgGate({ n: spec.n, x: 0, y: 0, label: null })}</svg>`;
  }
  if (spec.kind === "edge") {
    const e = { pts: [[4, 20], [120, 20]], style: spec.style, end: true, start: false };
    return `<svg viewBox="0 4 130 32"><defs>${markerDefs("pv-" + spec.style)}</defs>${svgEdge(e, "pv-" + spec.style)}</svg>`;
  }
  if (spec.kind === "text") {
    const sample = { title: "Title", subtitle: "Subtitle", eyebrow: "Eyebrow", heading: "Heading", label: "Label", note: "Note",
                     gatenote: "Gate note", mono: "prefix/" }[spec.role];
    return `<svg viewBox="0 0 160 40">${svgText({ role: spec.role, s: sample, x: 6, y: 27, anchor: "start" })}</svg>`;
  }
  return "";
}

function buildPalette() {
  const root = $("palette");
  PALETTE.forEach(section => {
    const det = document.createElement("details");
    det.className = "psec"; det.open = true;
    det.innerHTML = `<summary>${section.title}</summary><div class="pgrid${section.wide ? " wide" : ""}"></div>`;
    const grid = det.querySelector(".pgrid");
    for (const spec of section.items) {
      const item = document.createElement("div");
      item.className = "pitem"; item.title = spec.kind === "edge" ? "Click, then drag between shapes on the board" : "Click to add, or drag onto the board";
      item.dataset.search = (spec.label + " " + section.title).toLowerCase();
      if (spec.kind === "edge") item.dataset.arrow = spec.style;
      item.innerHTML = previewSvg(spec) + `<span>${esc(spec.label)}</span>`;
      item.addEventListener("pointerdown", evt => paletteDrag(evt, spec, item));
      grid.appendChild(item);
    }
    root.appendChild(det);
  });
  $("psearch").addEventListener("input", evt => {
    const q = evt.target.value.trim().toLowerCase();
    for (const det of root.querySelectorAll(".psec")) {
      let any = false;
      for (const item of det.querySelectorAll(".pitem")) { const show = !q || item.dataset.search.includes(q); item.style.display = show ? "" : "none"; any = any || show; }
      det.style.display = any ? "" : "none";
      if (q && any) det.open = true;
    }
  });
}

function paletteDrag(evt, spec, item) {
  evt.preventDefault();
  if (spec.kind === "edge") { state.arrowStyle = spec.style; setTool("arrow"); return; }
  const start = [evt.clientX, evt.clientY];
  let ghost = null;
  const move = e => {
    if (!ghost && Math.hypot(e.clientX - start[0], e.clientY - start[1]) > 5) {
      ghost = item.cloneNode(true);
      Object.assign(ghost.style, { position: "fixed", width: item.offsetWidth + "px", pointerEvents: "none", opacity: ".85", zIndex: 10 });
      document.body.appendChild(ghost);
    }
    if (ghost) { ghost.style.left = e.clientX - item.offsetWidth / 2 + "px"; ghost.style.top = e.clientY - 20 + "px"; }
  };
  const up = e => {
    window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up);
    if (ghost) {
      ghost.remove();
      const r = svg.getBoundingClientRect();
      if (e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom) addElement(spec, boardPoint(e));
    } else addElement(spec);
  };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}

function setTool(tool) {
  state.tool = tool;
  $("btnSelect").classList.toggle("on", tool === "select");
  $("btnArrow").classList.toggle("on", tool === "arrow");
  stage.classList.toggle("tool-arrow", tool === "arrow");
  for (const it of document.querySelectorAll(".pitem[data-arrow]")) it.classList.toggle("on", tool === "arrow" && it.dataset.arrow === state.arrowStyle);
  $("hint").textContent = tool === "arrow"
    ? `Arrow (${EDGE_STYLES[state.arrowStyle]}): drag from one shape to another · Esc to stop`
    : "Drag to move · Space + drag to pan · Ctrl + scroll to zoom";
}

/* Inside a claude.ai artifact, files go through the viewer's download prompt; opened from disk, a plain link works. */
let downloadsCapability = null;
async function download(name, blob) {
  if (!downloadsCapability) downloadsCapability = window.claude?.use ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
  const downloads = await downloadsCapability;
  if (downloads) {
    try { await downloads.save({ filename: name, data: blob }); toast(`Saved ${name}`); }
    catch (err) { if (err && err.code !== "declined") toast(`Could not save ${name}: ${err.message || err.code}`); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function saveJson() {
  download(`${state.board.slug}.json`, new Blob([JSON.stringify({ format: "claimclarity-diagram", version: 1, board: state.board }, null, 1)], { type: "application/json" }));
}
$("btnSave").addEventListener("click", saveJson);
$("btnOpen").addEventListener("click", () => $("fileOpen").click());
$("fileOpen").addEventListener("change", async evt => {
  const file = evt.target.files[0];
  evt.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const board = data.board || data;
    if (!board.nodes || !board.w) throw new Error("This file is not a ClaimClarity diagram.");
    if (!board.slug) board.slug = file.name.replace(/\.json$/i, "");
    openBoard(board);
  } catch (err) { toast(`Could not open ${file.name}: ${err.message}`); }
});
$("btnSvg").addEventListener("click", () => download(`${state.board.slug}.svg`, new Blob([boardToSvg(state.board)], { type: "image/svg+xml" })));

async function embeddedFontCss() {
  const css = await (await fetch(FONTS_URL)).text();
  const latin = css.split("/*").filter(block => block.startsWith(" latin */")).map(block => "/*" + block).join("\n");
  let out = latin;
  for (const [, url] of latin.matchAll(/url\((https:[^)]+)\)/g)) {
    const blob = await (await fetch(url)).blob();
    const dataUrl = await new Promise(res => { const r = new FileReader(); r.onload = () => res(r.result); r.readAsDataURL(blob); });
    out = out.replace(url, dataUrl);
  }
  return out;
}
$("btnPng").addEventListener("click", async () => {
  toast("Rendering PNG…");
  let fontCss = "";
  try { fontCss = await embeddedFontCss(); } catch (_) { toast("Fonts could not be embedded (offline?); the PNG uses fallback fonts."); }
  const b = state.board, scale = Math.min(2, 8000 / Math.max(b.w, b.h));
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(b.w * scale); canvas.height = Math.round(b.h * scale);
    const ctx = canvas.getContext("2d");
    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
    canvas.toBlob(blob => download(`${b.slug}.png`, blob), "image/png");
  };
  img.onerror = () => toast("PNG export failed in this browser; use SVG instead.");
  img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(boardToSvg(b, fontCss));
});

let toastTimer = null;
function toast(msg) {
  const t = $("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("show"), 3200);
}

$("btnSelect").addEventListener("click", () => setTool("select"));
$("btnArrow").addEventListener("click", () => setTool(state.tool === "arrow" ? "select" : "arrow"));
$("btnSnap").addEventListener("click", () => { state.snap = !state.snap; $("btnSnap").classList.toggle("on", state.snap); });
$("btnUndo").addEventListener("click", undo);
$("btnRedo").addEventListener("click", redo);
$("btnZoomIn").addEventListener("click", () => { const r = svg.getBoundingClientRect(); zoomAt(1.25, r.left + r.width / 2, r.top + r.height / 2); });
$("btnZoomOut").addEventListener("click", () => { const r = svg.getBoundingClientRect(); zoomAt(0.8, r.left + r.width / 2, r.top + r.height / 2); });
$("btnFit").addEventListener("click", fitView);
window.addEventListener("resize", applyView);
