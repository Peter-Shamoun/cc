<title>ClaimClarity Diagram Editor</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap">
<style>
/* One-screen tool: a slim header (board tabs, save state, actions) above a full-bleed Excalidraw canvas. */
:root {
  --bg: #F4F6FA;
  --bar: #FFFFFF;
  --ink: #1A1D23;
  --muted: #5A606B;
  --line: #C9CBCE;
  --navy: #1C2B57;
  --blue: #4A6BB0;
  --tint: #EAF0F9;
  --ok: #2E7D4F;
  --warn: #A15C00;
  --bad: #B3261E;
  --on-navy: #FFFFFF;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151C; --bar: #1A1E27; --ink: #E6E8EB; --muted: #A0A6B1; --line: #343A46;
    --navy: #8FA8E0; --blue: #8FA8E0; --tint: #222A3A; --ok: #6CC08F; --warn: #E0A54A; --bad: #F08A80;
    --on-navy: #12151C; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151C; --bar: #1A1E27; --ink: #E6E8EB; --muted: #A0A6B1; --line: #343A46;
  --navy: #8FA8E0; --blue: #8FA8E0; --tint: #222A3A; --ok: #6CC08F; --warn: #E0A54A; --bad: #F08A80;
  --on-navy: #12151C; color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; }
.app { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--bar); border-bottom: 1px solid var(--line);
}
.brand { display: flex; flex-direction: column; line-height: 1.1; }
.brand b { font-family: var(--font-display); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; font-size: 15px; color: var(--navy); }
.brand span { font-size: 12px; color: var(--muted); }
.tabs { display: flex; gap: 2px; overflow-x: auto; min-width: 0; flex: 1 1 420px; scrollbar-width: thin; }
.tab {
  flex: none; border: 0; background: transparent; color: var(--muted); font: 500 13px/1 var(--font-body);
  padding: 9px 10px; border-radius: 6px; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap;
}
.tab .num { font-family: var(--font-display); font-weight: 600; font-size: 13px; letter-spacing: 0.04em; color: var(--blue); }
.tab:hover { background: var(--tint); color: var(--ink); }
.tab[aria-selected="true"] { background: var(--tint); color: var(--ink); box-shadow: inset 0 -2px 0 var(--navy); }
.tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
.tab:focus-visible, .btn:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.side { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.state { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.state::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.state[data-kind="saved"]::before { background: var(--ok); }
.state[data-kind="dirty"]::before { background: var(--warn); }
.state[data-kind="error"] { color: var(--bad); }
.state[data-kind="error"]::before { background: var(--bad); }
.btn {
  border: 1px solid var(--line); background: var(--bar); color: var(--ink); font: 500 13px/1 var(--font-body);
  padding: 8px 12px; border-radius: 6px; cursor: pointer; white-space: nowrap;
}
.btn:hover { border-color: var(--blue); }
.btn.primary { background: var(--navy); border-color: var(--navy); color: var(--on-navy); }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: default; border-color: var(--line); }
.menu { position: relative; }
.menu-list {
  position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; min-width: 190px; display: flex; flex-direction: column;
  background: var(--bar); border: 1px solid var(--line); border-radius: 8px; padding: 4px; box-shadow: 0 8px 24px rgb(0 0 0 / 0.14);
}
.menu-list button { text-align: left; border: 0; background: transparent; color: var(--ink); font: 13px var(--font-body); padding: 8px 10px; border-radius: 4px; cursor: pointer; }
.menu-list button:hover { background: var(--tint); }
.menu-list small { color: var(--muted); padding: 6px 10px 2px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.confirm { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.stage { position: relative; flex: 1; min-height: 0; }
.stage .excalidraw { --color-primary: #4A6BB0; }
#canvas { position: absolute; inset: 0; }
.notice {
  position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); padding: 24px;
  font-size: 14px; background: var(--bg);
}
.notice b { display: block; font-family: var(--font-display); text-transform: uppercase; letter-spacing: 0.06em; color: var(--navy); font-size: 16px; margin-bottom: 6px; }
@media (max-width: 720px) {
  .brand span { display: none; }
  .tabs { order: 3; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><b>ClaimClarity</b><span>Architecture diagram editor</span></div>
    <nav class="tabs" id="tabs" role="tablist" aria-label="Diagrams"></nav>
    <div class="side">
      <span class="state" id="state" data-kind="idle" aria-live="polite">Loading</span>
      <span id="revert-slot"></span>
      <div class="menu">
        <button class="btn" id="export-btn" aria-haspopup="true" aria-expanded="false" hidden>Export</button>
        <div class="menu-list" id="export-menu" hidden>
          <small>This diagram</small>
          <button id="export-excalidraw">Excalidraw file (.excalidraw)</button>
          <button id="export-png">PNG image, 2x</button>
          <button id="export-svg">SVG image</button>
        </div>
      </div>
      <button class="btn primary" id="save-btn" disabled>Save</button>
    </div>
  </header>
  <main class="stage">
    <div id="canvas"></div>
    <div class="notice" id="notice"><div><b>Loading the editor</b>Fetching Excalidraw and the seven ClaimClarity diagrams.</div></div>
  </main>
</div>

<script type="importmap">
{ "imports": {
  "https://cdn.jsdelivr.net/npm/react@18.2.0/": "https://cdn.jsdelivr.net/npm/react@19.0.0/",
  "https://cdn.jsdelivr.net/npm/react@18.3.1/": "https://cdn.jsdelivr.net/npm/react@19.0.0/",
  "https://cdn.jsdelivr.net/npm/react@19.2.7/": "https://cdn.jsdelivr.net/npm/react@19.0.0/",
  "https://cdn.jsdelivr.net/npm/react-dom@18.2.0/": "https://cdn.jsdelivr.net/npm/react-dom@19.0.0/",
  "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/": "https://cdn.jsdelivr.net/npm/react-dom@19.0.0/",
  "https://cdn.jsdelivr.net/npm/scheduler@0.23.2/": "https://cdn.jsdelivr.net/npm/scheduler@0.25.0/",
  "https://cdn.jsdelivr.net/npm/jotai@2.9.3/": "https://cdn.jsdelivr.net/npm/jotai@2.11.0/"
} }
</script>
<!-- jsDelivr's ESM builds pin each dependency's own React; the map makes every module share one React and one jotai. -->
<script type="module">
const DIAGRAMS = [
  { id: "main-board", num: "", name: "Main board", file: "diagrams/main-board.excalidraw" },
  { id: "00-storage", num: "00", name: "Storage", file: "diagrams/00-storage.excalidraw" },
  { id: "01-ingestion", num: "01", name: "Ingestion", file: "diagrams/01-ingestion.excalidraw" },
  { id: "02-login", num: "02", name: "Login", file: "diagrams/02-login.excalidraw" },
  { id: "03-query-path", num: "03", name: "Query path", file: "diagrams/03-query-path.excalidraw" },
  { id: "04-analyzer", num: "04", name: "Analyzer", file: "diagrams/04-analyzer.excalidraw" },
  { id: "05-chat-backend", num: "05", name: "Chat backend", file: "diagrams/05-chat-backend.excalidraw" },
];
const FONT_FILES = [
  "fonts/Excalifont/Excalifont-Regular-349fac6ca4700ffec595a7150a0d1e1d.woff2",
  "fonts/Excalifont/Excalifont-Regular-3f2c5db56cc93c5a6873b1361d730c16.woff2",
  "fonts/Excalifont/Excalifont-Regular-41b173a47b57366892116a575a43e2b6.woff2",
  "fonts/Excalifont/Excalifont-Regular-623ccf21b21ef6b3a0d87738f77eb071.woff2",
  "fonts/Excalifont/Excalifont-Regular-a88b72a24fb54c9f94e3b5fdaa7481c9.woff2",
  "fonts/Excalifont/Excalifont-Regular-b9dcf9d2e50a1eaf42fc664b50a3fd0d.woff2",
  "fonts/Excalifont/Excalifont-Regular-be310b9bcd4f1a43f571c46df7809174.woff2",
  "fonts/Cascadia/CascadiaCode-Regular.woff2",
  "fonts/Liberation/LiberationSans-Regular.woff2",
];
const CDN = "https://cdn.jsdelivr.net/npm";
const MAX_SAVED_BYTES = 240 * 1024;   // the store keeps documents up to 256 KiB

const $ = (id) => document.getElementById(id);
const notice = (title, body) => { $("notice").hidden = false; $("notice").innerHTML = ""; const d = document.createElement("div"); const b = document.createElement("b"); b.textContent = title; d.append(b, body); $("notice").append(d); };

// The sandbox only lets fonts come from Google Fonts, so the editor's own fonts are fetched from this
// page's files and handed to FontFace as bytes instead of URLs.
const fontBytes = new Map();
await Promise.all(FONT_FILES.map(async (path) => {
  try { const r = await fetch(path); if (r.ok) fontBytes.set(path.split("/").pop(), await r.arrayBuffer()); } catch {}
}));
const NativeFontFace = window.FontFace;
function FontFaceFromPageFiles(family, source, descriptors) {
  if (typeof source === "string") {
    const name = (source.match(/[\w-]+\.woff2/) || [])[0];
    if (name && fontBytes.has(name)) return new NativeFontFace(family, fontBytes.get(name).slice(0), descriptors);
  }
  return new NativeFontFace(family, source, descriptors);
}
FontFaceFromPageFiles.prototype = NativeFontFace.prototype;
window.FontFace = FontFaceFromPageFiles;
window.EXCALIDRAW_ASSET_PATH = new URL("./", location.href).href;

let React, ReactDOMClient, Ex;
try {
  [React, ReactDOMClient, Ex] = await Promise.all([
    import(`${CDN}/react@19.0.0/+esm`),
    import(`${CDN}/react-dom@19.0.0/client/+esm`),
    import(`${CDN}/@excalidraw/excalidraw@0.18.0/+esm`),
  ]);
  const css = await (await fetch("excalidraw.css")).text();
  const style = document.createElement("style"); style.textContent = css; document.head.append(style);
} catch (error) {
  notice("The editor could not load", "Excalidraw did not download. Reload the page to try again.");
  throw error;
}
const h = React.createElement;

// ---------- saved edits: one compressed scene per diagram in the artifact's store ----------
async function gzipBase64(text) {
  const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
  const bytes = new Uint8Array(await new Response(stream).arrayBuffer());
  let binary = ""; for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
  return btoa(binary);
}
async function gunzipBase64(b64) {
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
}

const boards = new Map();   // id -> { committed, saved, current: {elements, files}, baseline, dirty, savedAt, savedBy }
DIAGRAMS.forEach((d) => boards.set(d.id, { dirty: false }));
let activeId = DIAGRAMS.some((d) => d.id === location.hash.slice(1)) ? location.hash.slice(1) : "main-board";
let db = null, viewerId = null, downloads = null, api = null;

const elementsVersion = (elements) => elements.reduce((sum, e) => sum + e.version, 0);
function sourceFileIds(board) { return new Set(Object.keys(board.committed?.files || {})); }

async function loadCommitted(d) {
  const board = boards.get(d.id);
  if (!board.committed) {
    const data = await (await fetch(d.file)).json();
    board.committed = { elements: data.elements, files: data.files || {}, appState: data.appState || {} };
  }
  return board.committed;
}

// ---------- header: tabs, status, actions ----------
function renderTabs() {
  const nav = $("tabs"); nav.innerHTML = "";
  for (const d of DIAGRAMS) {
    const b = document.createElement("button");
    b.className = "tab"; b.role = "tab"; b.id = `tab-${d.id}`;
    b.setAttribute("aria-selected", String(d.id === activeId));
    if (d.num) { const n = document.createElement("span"); n.className = "num"; n.textContent = d.num; b.append(n); }
    b.append(d.name);
    if (boards.get(d.id).dirty) { const dot = document.createElement("span"); dot.className = "dot"; dot.title = "Unsaved changes"; b.append(dot); }
    b.onclick = () => openBoard(d.id);
    nav.append(b);
  }
}
function timeAgo(iso) {
  const when = new Date(iso);
  return when.toLocaleString(undefined, { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
}
function setState(kind, text) { $("state").dataset.kind = kind; $("state").textContent = text; }
function renderState() {
  const board = boards.get(activeId);
  if (board.error) return setState("error", board.error);
  if (board.dirty) setState("dirty", "Unsaved changes");
  else if (board.savedAt) setState("saved", `Saved ${timeAgo(board.savedAt)}${board.savedBy && board.savedBy === viewerId ? " by you" : ""}`);
  else setState("idle", "Committed version");
  $("save-btn").disabled = !db || !board.dirty;
  $("save-btn").title = db ? "" : "Saving needs a signed-in viewer with edit access";
  renderRevert();
}
function renderRevert() {
  const slot = $("revert-slot"); slot.innerHTML = "";
  const board = boards.get(activeId);
  if (!board.dirty && !board.savedAt) return;
  const b = document.createElement("button"); b.className = "btn"; b.textContent = "Revert";
  b.title = "Load the committed version of this diagram into the canvas";
  b.onclick = () => {
    slot.innerHTML = "";
    const box = document.createElement("span"); box.className = "confirm";
    box.append("Load the committed version?");
    const yes = document.createElement("button"); yes.className = "btn danger"; yes.textContent = "Load it";
    const no = document.createElement("button"); no.className = "btn"; no.textContent = "Cancel";
    yes.onclick = () => revertToCommitted(); no.onclick = renderRevert;
    box.append(yes, no); slot.append(box); no.focus();
  };
  slot.append(b);
}

// ---------- the canvas ----------
const root = ReactDOMClient.createRoot($("canvas"));
function sceneFor(board) {
  const source = board.current || board.saved || board.committed;
  const elements = Ex.restoreElements(source.elements, null, { refreshDimensions: true, repairBindings: true });
  return { elements, files: { ...(board.committed.files || {}), ...(source.files || {}) } };
}
async function openBoard(id) {
  activeId = id;
  try { history.replaceState(null, "", `#${id}`); } catch {}
  const d = DIAGRAMS.find((x) => x.id === id);
  const board = boards.get(id);
  renderTabs(); renderState();
  try { await loadCommitted(d); } catch { board.error = "This diagram's source file did not load"; renderState(); return; }
  const scene = sceneFor(board);
  board.baseline = null;
  $("notice").hidden = true;
  root.render(h(Ex.Excalidraw, {
    key: id,
    excalidrawAPI: (a) => { api = a; setTimeout(() => a.scrollToContent(undefined, { fitToViewport: true, viewportZoomFactor: 0.92, animate: false }), 60); },
    initialData: { elements: scene.elements, files: scene.files, appState: { viewBackgroundColor: "#FFFFFF", currentItemFontFamily: 5 } },
    theme: "light",
    name: `ClaimClarity ${d.num} ${d.name}`.replace(/\s+/g, " "),
    UIOptions: { canvasActions: { loadScene: false, saveToActiveFile: false, export: false, saveAsImage: false, toggleTheme: false } },
    onChange: (elements, appState, files) => {
      if (activeId !== id) return;
      const version = elementsVersion(elements);
      if (board.baseline === null) { board.baseline = board.dirty ? -1 : version; }
      board.current = { elements, files };
      const dirty = board.baseline === -1 || version !== board.baseline;
      if (dirty !== board.dirty) { board.dirty = dirty; renderTabs(); renderState(); }
    },
  }, h(Ex.MainMenu, null, h(Ex.MainMenu.DefaultItems.ClearCanvas), h(Ex.MainMenu.DefaultItems.ChangeCanvasBackground), h(Ex.MainMenu.DefaultItems.Help))));
}
function revertToCommitted() {
  const board = boards.get(activeId);
  board.current = { elements: board.committed.elements, files: board.committed.files };
  board.dirty = true; board.error = null;
  openBoard(activeId);
}

async function save() {
  const board = boards.get(activeId);
  if (!db || !api) return;
  const elements = api.getSceneElements();
  const keep = sourceFileIds(board);
  const allFiles = api.getFiles();
  const used = new Set(elements.filter((e) => e.type === "image").map((e) => e.fileId));
  const files = Object.fromEntries(Object.entries(allFiles).filter(([fid]) => used.has(fid) && !keep.has(fid)));
  const json = JSON.stringify({ type: "excalidraw", version: 2, source: "ClaimClarity diagram editor", elements, files });
  $("save-btn").disabled = true; setState("idle", "Saving");
  try {
    const scene = await gzipBase64(json);
    if (scene.length > MAX_SAVED_BYTES) throw { code: "too_large" };
    const record = { scene, encoding: "gzip+base64", savedAt: new Date().toISOString(), savedBy: viewerId || "", elementCount: elements.length };
    await db.doc(`diagrams/${activeId}`).set(record);
    try { await db.collection(`diagrams/${activeId}/versions`).add(record); } catch {}
    board.saved = { elements, files }; board.savedAt = record.savedAt; board.savedBy = record.savedBy;
    board.baseline = elementsVersion(elements); board.current = { elements, files: allFiles };
    board.dirty = false; board.error = null;
  } catch (error) {
    board.error = error?.code === "too_large" ? "Too large to save. Remove pasted images and try again."
      : error?.code === "quota_exceeded" ? "The editor's storage is full."
      : "Save failed. Your edits are still on the canvas; try Save again.";
  }
  renderTabs(); renderState();
  if (board.error) { const msg = board.error; setTimeout(() => { if (board.error === msg) { board.error = null; renderState(); } }, 6000); }
}
$("save-btn").onclick = save;
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "s") { e.preventDefault(); if (!$("save-btn").disabled) save(); }
});

// ---------- exports through the viewer's save dialog ----------
function toggleExport(open) { $("export-menu").hidden = !open; $("export-btn").setAttribute("aria-expanded", String(open)); }
$("export-btn").onclick = (e) => { e.stopPropagation(); toggleExport($("export-menu").hidden); };
document.addEventListener("click", () => toggleExport(false));
async function exportAs(kind) {
  toggleExport(false);
  if (!api || !downloads) return;
  const d = DIAGRAMS.find((x) => x.id === activeId);
  const elements = api.getSceneElements(), files = api.getFiles();
  const appState = { ...api.getAppState(), exportBackground: true, viewBackgroundColor: "#FFFFFF", exportWithDarkMode: false };
  let data, filename;
  if (kind === "excalidraw") { data = Ex.serializeAsJSON(elements, appState, files, "local"); filename = `${d.id}.excalidraw`; }
  if (kind === "png") { data = await Ex.exportToBlob({ elements, appState, files, mimeType: "image/png", getDimensions: (w, hh) => ({ width: w * 2, height: hh * 2, scale: 2 }) }); filename = `${d.id}.png`; }
  if (kind === "svg") { data = new XMLSerializer().serializeToString(await Ex.exportToSvg({ elements, appState, files })); filename = `${d.id}.svg`; }
  try { await downloads.save({ filename, data }); } catch {}
}
$("export-excalidraw").onclick = () => exportAs("excalidraw");
$("export-png").onclick = () => exportAs("png");
$("export-svg").onclick = () => exportAs("svg");
addEventListener("beforeunload", (e) => { if ([...boards.values()].some((b) => b.dirty)) e.preventDefault(); });

// ---------- start ----------
renderTabs();
await openBoard(activeId);

(async () => {
  const claude = window.claude;
  if (!claude?.use) { renderState(); return; }
  const [store, user, dl] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]);
  downloads = dl; $("export-btn").hidden = !dl;
  try { viewerId = user ? await user.id() : null; } catch {}
  db = store;
  if (!db) { renderState(); return; }
  db.collection("diagrams").onSnapshot(async (snapshot) => {
    for (const doc of snapshot.docs) {
      const board = boards.get(doc.id); const rec = doc.data();
      if (!board || !rec?.scene || rec.savedAt === board.savedAt) continue;
      try {
        const parsed = JSON.parse(await gunzipBase64(rec.scene));
        board.saved = { elements: parsed.elements, files: parsed.files || {} };
        board.savedAt = rec.savedAt; board.savedBy = rec.savedBy;
        if (!board.dirty) { board.current = null; if (doc.id === activeId) await openBoard(activeId); }
      } catch {}
    }
    renderTabs(); renderState();
  }, () => renderState());
  renderState();
})();
</script>
