<script>
"use strict";
const CANVAS = {"items": [{"slug": "main", "title": "ClaimClarity \u00b7 Data backend", "x": 0, "y": 0, "w": 3075, "h": 2254}, {"slug": "00-storage", "title": "00 \u00b7 Storage & isolation", "x": -300, "y": -1300, "w": 2300, "h": 800}, {"slug": "01-ingestion", "title": "01 \u00b7 Ingestion & parse", "x": 2300, "y": -1340, "w": 2200, "h": 840}, {"slug": "02-login", "title": "Login & customer mapping", "x": -2900, "y": 975, "w": 2500, "h": 1000}, {"slug": "03-query-path", "title": "03 \u00b7 Query path", "x": 3475, "y": 975, "w": 2620, "h": 1000}, {"slug": "04-analyzer", "title": "04 \u00b7 Analyzer", "x": -34, "y": 2654, "w": 4080, "h": 1200}, {"slug": "05-access-matrix", "title": "05 \u00b7 Access matrix", "x": -3120, "y": -1340, "w": 2420, "h": 1558}], "links": [{"number": "00", "start": [1525.0, 400.0], "end": [1525.0, -500]}, {"number": "01", "start": [2400.0, 400.0], "end": [2400.0, -500]}, {"number": "02", "start": [1300.0, 1475.0], "end": [-400, 1475.0]}, {"number": "03", "start": [2425.0, 1475.0], "end": [3475, 1475.0]}, {"number": "04", "start": [2006.0, 1656.0], "end": [2006.0, 2654]}], "bounds": [-3520, -1740, 10015, 5994]};
const stage = document.getElementById("stage"), world = document.getElementById("world");
const [BX, BY, BW, BH] = CANVAS.bounds;
world.style.width = BW + "px"; world.style.height = BH + "px";
const view = { x: 0, y: 0, z: 0.1 };

/* dashed connectors from each zoom badge on the main board to its drill-down */
const links = document.getElementById("links");
links.setAttribute("width", BW); links.setAttribute("height", BH);
links.innerHTML = CANVAS.links.map(({ number, start, end }) => {
  const [x1, y1, x2, y2] = [start[0] - BX, start[1] - BY, end[0] - BX, end[1] - BY];
  return `<path d="M${x1},${y1} L${x2},${y2}" stroke="#4A6BB0" stroke-width="7" stroke-dasharray="26 16" fill="none" opacity=".75"/>` +
         `<circle cx="${x2}" cy="${y2}" r="34" fill="#4A6BB0" stroke="#fff" stroke-width="5"/>` +
         `<text x="${x2}" y="${y2 + 12}" text-anchor="middle" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="34" fill="#fff">${number}</text>`;
}).join("");

function apply(animate) {
  world.style.transition = animate ? "transform .45s ease" : "none";
  world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
  document.getElementById("zoomLabel").textContent = Math.round(view.z * 100) + "%";
}
function frame(x, y, w, h, animate, pad = 40) {
  const sw = stage.clientWidth, sh = stage.clientHeight;
  const z = Math.min((sw - pad * 2) / w, (sh - pad * 2) / h);
  view.z = z; view.x = (sw - w * z) / 2 - (x - BX) * z; view.y = (sh - h * z) / 2 - (y - BY) * z;
  apply(animate);
}
const fitAll = animate => frame(BX + 300, BY + 300, BW - 600, BH - 600, animate, 24);
function showBoard(slug, animate = true) {
  const item = CANVAS.items.find(i => i.slug === slug);
  if (!item) return fitAll(animate);
  frame(item.x, item.y, item.w, item.h, animate);
  document.querySelectorAll("#chips button").forEach(b => b.classList.toggle("on", b.dataset.slug === slug));
}
function zoomAt(factor, cx, cy) {
  const r = stage.getBoundingClientRect(), px = cx - r.left, py = cy - r.top;
  const z = Math.min(3, Math.max(0.02, view.z * factor));
  view.x = px - (px - view.x) * z / view.z; view.y = py - (py - view.y) * z / view.z; view.z = z;
  apply(false);
}

/* board chips in the header */
const chips = document.getElementById("chips");
for (const item of CANVAS.items) {
  const b = document.createElement("button");
  b.type = "button"; b.dataset.slug = item.slug;
  b.textContent = item.slug === "main" ? "Main board" : `${item.slug.slice(0, 2)} · ${item.title.replace(/^\d\d · /, "")}`;
  b.addEventListener("click", () => { history.replaceState(null, "", "#" + item.slug); showBoard(item.slug); });
  chips.appendChild(b);
}
document.getElementById("fit").addEventListener("click", () => { history.replaceState(null, "", location.pathname); fitAll(true);
  document.querySelectorAll("#chips button").forEach(b => b.classList.remove("on")); });
document.getElementById("zoomIn").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(1.3, r.left + r.width / 2, r.top + r.height / 2); });
document.getElementById("zoomOut").addEventListener("click", () => { const r = stage.getBoundingClientRect(); zoomAt(1 / 1.3, r.left + r.width / 2, r.top + r.height / 2); });

/* pan with one pointer, pinch with two */
const pointers = new Map();
let pinch = null;
stage.addEventListener("pointerdown", e => {
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  stage.classList.add("dragging");
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinch = { d: Math.hypot(a[0] - b[0], a[1] - b[1]) }; }
});
stage.addEventListener("pointermove", e => {
  if (!pointers.has(e.pointerId)) return;
  const [px, py] = pointers.get(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if (pointers.size === 1) { view.x += e.clientX - px; view.y += e.clientY - py; apply(false); }
  else if (pinch) {
    const [a, b] = [...pointers.values()], d = Math.hypot(a[0] - b[0], a[1] - b[1]);
    zoomAt(d / pinch.d, (a[0] + b[0]) / 2, (a[1] + b[1]) / 2); pinch.d = d;
  }
});
const release = e => { pointers.delete(e.pointerId); if (pointers.size < 2) pinch = null; if (!pointers.size) stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", release); stage.addEventListener("pointercancel", release);
stage.addEventListener("wheel", e => {
  e.preventDefault();
  if (e.shiftKey) { view.x -= e.deltaY; apply(false); return; }
  zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? 0.01 : 0.0015)), e.clientX, e.clientY);
}, { passive: false });
stage.addEventListener("dblclick", e => { const b = e.target.closest(".board"); if (b) showBoard(b.dataset.slug); });
document.addEventListener("keydown", e => { if (e.key === "0") fitAll(true); });
window.addEventListener("resize", () => fitAll(false));
window.addEventListener("hashchange", () => showBoard(location.hash.slice(1)));
