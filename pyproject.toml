[project]
name = "cc-design"
version = "0.1.0"
description = "CC data model, agent interface and diagram tooling"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6",
    "sqlglot>=25",
    "pyarrow>=15",
    "cryptography>=42",
    "boto3>=1.36",
]

[project.optional-dependencies]
tools = [
    "jsonschema>=4",
    "pillow>=10",
]
dev = [
    "pytest>=8",
    "cc-design[tools]",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
