[project]
name = "claimclarity-design"
version = "0.1.0"
description = "ClaimClarity data model, agent interface and diagram tooling"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pyyaml>=6",
    "sqlglot>=25",
]

[project.optional-dependencies]
tools = [
    "jsonschema>=4",
    "pillow>=10",
]
dev = [
    "pytest>=8",
    "claimclarity-design[tools]",
]

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
testpaths = ["tests"]
