# EDI realism calibration spec: clinical reference lab, 837P (005010X222A1) out, 835 (005010X221A1) in
# Target: one tenant = mid/large regional reference lab producing ~5 MB of raw EDI per business day.
# Researched 2026-10-25. Every target has a source and a confidence:
#   high   = primary source (CMS file, SEC filing, TR3/CMS companion guide) or a direct computation from one
#   medium = vendor benchmark (XiFin, Optum), or payer guidance generalized across payers
#   low    = estimate or extrapolation; no public measurement found. Treat these as tunable defaults.
# Distributions: {min, typical, max} = a plausible range around the mode; "weights" are relative.
# "current" shows what ccsim/edi_mock.py v2.0 does today, where it differs.

