# ---------------------------------------------------------------------------------------------------
# 8. DATA QUALITY QUIRKS A PARSER MUST SURVIVE (rates per file unless noted)
# ---------------------------------------------------------------------------------------------------
quirks:   # confidence: low for rates; all patterns are observed in production feeds
  envelope:
    wrapped_80_char_lines: 0.02
    multiple_isa_in_one_file: 0.05
    utf8_bom_or_leading_whitespace: 0.01
    trailing_nulls_or_ctrl_z: 0.005
    mixed_line_endings: 0.01
    lowercase_segment_content: 0.002
    isa_id_not_padded_to_15: 0.003   # breaks fixed-width ISA parsers; real
    se01_count_off_by_one: 0.002
    duplicate_isa13_control_number_across_days: 0.01
    byte_identical_redelivery: 0.03
    truncated_mid_segment: 0.005
    non_x12_file_in_drop (pdf/csv/html error page): 0.005
  "835_content":
    clp01_altered_by_payer: {rate_of_clps: 0.02, forms: ["uppercased", "truncated to 17 or 20 chars", "leading zeros stripped", "special chars removed"]}
    clp07_icn_reused_on_adjustment: 0.3   # of reversal/correction pairs
    missing_svc_dtm472_uses_claim_dtm232: 0.05
    amounts_with_trailing_zeros_or_plus: 0.01     # "10.50", "10.5", "+10.5" all appear
    negative_zero: 0.001
    cas_more_than_6_triplets_split: "always when needed"
    same_carc_under_two_groups_on_one_line: 0.005
    plb_with_multiple_adjustment_pairs: 0.2   # of PLB segments
    plb03_composite_reference_patient_account: 0.5
    unbalanced_835_from_payer_bug: 0.0005
    nm1_qc_name_differs_from_837 (nickname/hyphen/order): 0.03
    member_id_with_prefix_suffix: 0.1   # e.g. 'XYZ' alpha prefix, '01' suffix
    payer_name_changes_mid_month (merger/rebrand/platform): 0.01
  "837_content":
    names_with_apostrophe_hyphen_suffix: 0.06
    dob_1900_or_placeholder: 0.0005
    gender_u: 0.003
    zip5_for_patient: 0.2
    long_pcn_up_to_38: 0.05

# ---------------------------------------------------------------------------------------------------
# 9. SCENARIO KNOB TARGETS (direct mapping to Scenario fields)
# ---------------------------------------------------------------------------------------------------
scenario_targets:
  p_never_remitted: {value: 0.03, note: "within 60 days; includes paper-remit payers and pended claims", confidence: low}
  p_zero_pay_fee_schedule: {value: 0.01, confidence: low}
  p_partial_line_denial: {value: 0.06, note: "~60% of denied claims are partial", confidence: low}
  p_reversal_no_correction: {value: 0.004, confidence: low}
  p_reversal_correction: {value: 0.010, confidence: low}
  p_void: {value: 0.002, confidence: low}
  p_resubmit_after_co16: {value: 0.6, confidence: low}
  p_signal_v3_vs_recorded: {value: 0.45, confidence: low}
  p_late_submission: {value: 0.005, timely_filing_days: {medicare: 365, ma: 365, commercial: {min: 90, typical: 180, max: 365}, medicaid: {min: 90, typical: 180, max: 365}}, confidence: medium}
  p_dependent: {value: 0.22, note: "commercial only; Medicare/Medicaid are always self", confidence: low}
  p_secondary_coverage: {value: 0.06, confidence: low}
  p_risky_provider: {value: 0.08, confidence: low}
  p_duplicate_835_file: {value: 0.02, confidence: low}
  p_corrupt_file: {value: 0.01, confidence: low}
  p_plb_recoupment: {value: 0.06, confidence: medium}
  p_duplicate_submission: {value: 0.01, note: "real feeds DO have accidental resends; duplicate is #2 clinical denial category (15%)", source: xifin_2026, confidence: medium}
  claims_per_day: 3000
  skip_weekends: true
  skip_federal_holidays: true
