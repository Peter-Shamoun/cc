    clm_freq_mix: {"1": 0.955, "7": 0.035, "8": 0.010}
    ref_x4_clia: {required: true, rate: 0.995, note: "missing CLIA rejects at front end (Anthem); line-level REF*X4 allowed when lines differ", source: clia_ref_x4, confidence: high}
    ref_g1_prior_auth: {rate_molecular: 0.6, rate_other: 0.005}
    ref_f8_original_icn: "required on freq 7/8"
    ref_d9_clearinghouse_trace: {rate: 0.5}
    hi: {codes_per_claim: {1: 0.35, 2: 0.28, 3: 0.17, 4: 0.12, "5-12": 0.08}, qualifiers: "ABK first, ABF rest", no_decimal: true}
    nte: {rate: 0.03, use: "NTE*ADD for unlisted test description (81479 requires description in SV101-7 or NTE)"}
    pwk: {rate: 0.002}
    amt_f5_patient_paid: {rate: 0.01}
    referring_ordering:
