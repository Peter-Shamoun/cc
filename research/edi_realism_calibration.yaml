    sv1: "SV1*HC:<code>[:mod1:mod2:mod3:mod4][:::::description for unlisted]*charge*UN*units***1[:2:3:4]"
    dx_pointer: "SV107 up to 4 pointers; generator should point to the dx that justifies the test"
