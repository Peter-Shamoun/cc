# ---------------------------------------------------------------------------------------------------
# 1. VOLUME AND SIZE: 5 MB/day/customer -> claims/day and 835 files/day
# ---------------------------------------------------------------------------------------------------
size_model:
  method: >
    Built realistic segment lists for one claim (scratch script; field widths taken from real-looking
    values: 14-char PCN, 40-char addresses, 10-char NPI, 9-digit ZIP, CLIA REF*X4, REF*D9, REF*6R per line),
    no line breaks, '~' terminator. Bytes are linear in service lines.
  confidence: high   # arithmetic; segment choices are medium
  bytes_837_claim: {fixed: 398, per_line: 80, formula: "398 + 80*lines",
                    adders: {dependent_2000C: 142, cob_2320_2330_per_claim: 300, cob_svd_per_line: 52, prior_auth_ref_g1: 20},
                    examples: {1: 478, 2: 558, 4: 718, 6: 878, 8: 1038, 12: 1361}}
  bytes_835_clp:  {fixed: 213, per_line: 109, formula: "213 + 109*lines (Medicare; +~10% commercial for PR CAS/LQ/AMT*AU)",
                   claim_level_denial_no_svc: 254, examples: {1: 322, 2: 431, 4: 649, 6: 867, 8: 1085}}
  bytes_envelope: {"837_file": 620, "835_transaction": 659}
  line_endings: "add 1 byte/segment for LF or 2 for CRLF if the sender wraps (about 30 segments/claim, so +30 to +60 B)"
  current_generator: {bytes_per_837_claim: 467, segs_per_837_claim: 19.4, bytes_per_835_clp: 403, segs_per_clp: 17.4,
                      mean_lines_per_claim: "~2.1"}
  per_claim_all_in:
    lines_mean: 4.9
    bytes_837: 835          # incl. 20% dependents, 4% COB, 3% G1
    clp_per_claim: 1.10     # initial + secondary + reversal/correction + corrected-claim adjudications
    bytes_835: 848
    total: 1684
  mapping_5MB:
    interpretation_A_both_directions: {bytes_per_day: 5000000, claims_per_business_day: {min: 2700, typical: 3000, max: 3300},
                                       split: "about 50% 837 / 50% 835 by bytes", confidence: medium}
    interpretation_B_837_only: {claims_per_business_day: {min: 5500, typical: 6000, max: 6500}, confidence: medium}
    calendar_vs_business_day: "if 5 MB is a 7-day average, multiply business-day volume by 7/5 = 1.4"
    sanity_check: >
      Quest: ~244M requisitions/yr, 60% insurance-billed (43% insurers + 17% government) -> ~146M claims/yr,
      ~580k/business day. A 3,000-claim/day tenant is about 1/190 of Quest, i.e. ~5,000 requisitions/day
      (40% client-billed, never on an 837): a mid/large regional reference lab.
    source: quest_10k_2025
  recommended_tenant: {claims_per_business_day: 3000, saturday_claims_share_of_weekday: 0.0,
                       note: "billing systems batch Mon-Fri; Saturday DOS gets billed Monday"}
  volume_scale_needed_with_current_code: "~25x acme_labs (120/day) before realism fixes; ~13x after lines/claim fix"

volume:
  requisitions_to_claims:
    insurance_billed_share_of_requisitions: {value: 0.60, source: quest_10k_2025, confidence: high,
      detail: "2025 DIS volume: healthcare insurers 43%, government 17%, client payers 37% (never 837), patients 1%"}
    labcorp_2013_requisition_mix: {medicare_medicaid: 0.151, managed_care: 0.487, client: 0.345, source: labcorp_10k_2013, confidence: high}
  net_revenue_per_requisition_usd: {value: 44.2, source: quest_10k_2025, confidence: high,
      derivation: "DIS revenue $10,785M / 244M requisitions; all payers including client bill. Use as a check on mean paid per claim (~$35-60 routine mix)."}
  lines_per_claim:
    distribution_weights: {1: 17, 2: 13, 3: 12, 4: 12, 5: 11, 6: 9, 7: 7, 8: 6, "9-12": 8, "13-18": 4, "19-30": 1}
    mean: {min: 3.5, typical: 4.9, max: 6.5}
    hard_max: 50       # 837P 2400 loop repeat
    by_payer_class: {medicare: 6.0, medicare_advantage: 5.5, commercial: 4.3, medicaid: 4.0}
    evidence: >
      Medicare 2024: 318M CLFS-code lines (distinct bene x day x code) vs 40.3M venipuncture (36415) bene-days
      = 7.9 codes per blood-draw day across all labs; non-blood-draw encounters (urine, swab) pull the per-claim
      mean down. Commercial patients are younger with smaller panels.
    source: medicare_mup_2024
    confidence: medium
    current: "1-4 lines, mean ~2.1"
  units_per_line:
    default: 1
    overall_mean: {value: 1.08, source: medicare_mup_2024, confidence: high}
    code_specific_mean_units: {"87798": 10.3, "87150": 8.4, "87481": 3.1, "87801": 2.3, "88305": 1.7, "87186": 1.29,
                               "87077": 1.08, "87088": 1.04, "82570": 1.01}
    note: "87798/87150 carry many targets on ONE line (units 4-25); this is what MUE (CO-151) edits hit"
    source: medicare_mup_2024
    confidence: high
    current: "87798 units 1-3"
  claims_per_patient:
    medicare_blood_draw_days_per_tested_bene_per_year: {value: 2.7, source: medicare_mup_2024, confidence: high,
      derivation: "36415 Tot_Bene_Day_Srvcs 40.26M / Tot_Benes 14.92M"}
    panel_repeat_per_year: {"80053": 2.08, "80307": 2.46, "G0483": 2.12, "81528": 1.00, "81479": 1.25}
    commercial_claims_per_patient_per_year: {min: 1.3, typical: 1.8, max: 2.5, confidence: low}
    within_30_day_window: {typical_claims_per_distinct_patient: 1.15, max: 1.4, confidence: low,
      note: "drug-monitoring and anticoagulation patients are the repeaters (weekly/monthly)"}
    current: "patient pool = 0.35 x claims -> ~2.9 claims per patient in 30 days (too many repeats)"
  dos_to_submission_days:
    routine: {min: 1, typical: 2, max: 7}
    molecular_genetic: {min: 5, typical: 14, max: 45}
    held_for_missing_info_share: {value: 0.05, typical_hold_days: 10}
    confidence: low
  daily_pattern:
    business_days_only_for_837: true
    weekday_index_837: {Mon: 1.30, Tue: 1.10, Wed: 1.00, Thu: 0.95, Fri: 0.85}   # Mon carries Sat DOS
    dos_weekday_share: {Mon: 0.20, Tue: 0.19, Wed: 0.18, Thu: 0.18, Fri: 0.17, Sat: 0.06, Sun: 0.02}
    daily_noise_cv: 0.08
    confidence: low
    current: "Mon 1.3, Fri 0.9, uniform 0.8-1.2 noise (cv ~0.12)"
  holidays:
    us_federal: [new_years, mlk, presidents, memorial, juneteenth, independence, labor, columbus, veterans, thanksgiving, christmas]
    no_835_or_eft_on_federal_holidays: {value: true, confidence: high, note: "ACH does not settle; MACs do not issue"}
    day_after_holiday_837_volume_index: 1.5
    thanksgiving_and_christmas_weeks_dos_volume_index: 0.75
    confidence: medium
  seasonality_monthly_dos_index:   # routine x respiratory overlay
    routine: {Jan: 1.05, Feb: 1.00, Mar: 1.05, Apr: 1.00, May: 1.00, Jun: 0.95, Jul: 0.93, Aug: 1.00, Sep: 1.00, Oct: 1.03, Nov: 0.97, Dec: 0.90}
    respiratory_panels_87631_87637_0241U_87798resp: {Oct: 1.3, Nov: 2.0, Dec: 3.0, Jan: 3.2, Feb: 2.5, Mar: 1.6, Apr: 0.9, May: 0.6, Jun: 0.5, Jul: 0.6, Aug: 0.7, Sep: 0.9}
    evidence: "URMC weekly respiratory surveillance shows winter peak specimen counts; Labcorp attributes quarterly swings to weather/respiratory season"
    source: [urmc_resp, labcorp_q4_2025]
    confidence: low
  month_and_year_effects:
    jan_mar_deductible_reset: "PR share of allowed jumps (see patient_responsibility); patient-pay share highest Q1"
    medicare_fiscal_year_end_hold: {probability_per_year: 0.2, note: "occasional CMS payment hold last days of Sept; low confidence"}
    medicaid_state_fiscal_year_end_skip: {value: "NC skips last checkwrite of June and of December", source: nc_checkwrite, confidence: high}

# ---------------------------------------------------------------------------------------------------
# 2. PAYER MIX AND IDENTIFIERS
# ---------------------------------------------------------------------------------------------------
payer_mix:
  share_of_insurance_billed_claims:
    medicare_ffs_mac: {min: 0.15, typical: 0.20, max: 0.28}
    medicare_advantage: {min: 0.12, typical: 0.16, max: 0.22}
    medicaid_managed_care: {min: 0.08, typical: 0.11, max: 0.16}
    medicaid_ffs_state: {min: 0.02, typical: 0.03, max: 0.05}
    commercial_bcbs: {min: 0.15, typical: 0.20, max: 0.28}
    commercial_national_uhc_aetna_cigna_humana: {min: 0.15, typical: 0.21, max: 0.28}
    commercial_regional_tpa_other: {min: 0.05, typical: 0.07, max: 0.12}
    tricare_workcomp_other: {min: 0.01, typical: 0.02, max: 0.04}
    derivation: >
      Quest volume: government 17/60 = 28% of insurance-billed (Medicare FFS + Medicaid FFS; MA and Medicaid MCOs
      sit inside 'healthcare insurers'). MA = 54% of eligible beneficiaries (KFF 2025) so MA ~ Medicare FFS volume;
      Medicaid MCO = 78% of Medicaid enrollees (KFF 2024). Labcorp 2013: Medicare+Medicaid 15.1% of requisitions.
    source: [quest_10k_2025, labcorp_10k_2013, kff_ma_2025, kff_mco]
    confidence: medium
    current: "6 payers; no Medicare FFS at all; MA 15%, Medicaid 10%, commercial 75%"
  number_of_payers:
    distinct_837_payer_ids_per_month: {min: 150, typical: 300, max: 600}
    head_concentration: "top 10 payer IDs = ~70% of claims; Zipf-like tail (s ~1.1); ~40% of payer IDs see <5 claims/month"
    ma_concentration: {UHC: 0.29, Humana: 0.17, source: kff_ma_2025, confidence: high}
    confidence: low
  payer_id_conventions:
    medicare_mac_payer_id: "5-digit MAC contract/workload number of the jurisdiction where the LAB is located (independent labs bill their own MAC)"
    example_mac_ids: {palmetto_jm_nc_partb: "11502", novitas_jl_nj: "12402", noridian_je_ca_south: "01182", ngs_j6_il: "06102",
                      fcso_jn_fl: "09102", cgs_j15_oh: "15202", wps_j5_ia: "05102"}
    example_mac_ids_confidence: low  # pattern is right; verify specific numbers per MAC EDI page
    national_commercial_ids: {UHC: "87726", Aetna: "60054", Cigna: "62308", Humana: "61101", source: payer_ids, confidence: medium}
    clearinghouse_specific_ids: "many regional/Blues/Medicaid MCO IDs differ by clearinghouse; Aetna Better Health uses state IDs like 128MI"
    837_2010BB: "NM1*PR*2*<payer name as in clearinghouse list>*****PI*<payer id>"
    835_identification:
      N1_PR_name: "payer's own legal/processing name; often differs from the 837 name (e.g. 837 'UNITEDHEALTHCARE', 835 'UNITEDHEALTHCARE INSURANCE COMPANY' or 'UMR'; 837 'MEDICARE PART B', 835 'PALMETTO GBA')"
      N1_PR_N103_N104: "XV + CMS PlanID rarely; many payers omit N103/N104 entirely"
      TRN03: "'1' + payer EIN (10 chars) is the common convention; some state Medicaids send bare payer id"
      REF_2U: "payer id (Medicare: MAC contract number); present on ~50% of commercial 835s"
      isa06_sender: "clearinghouse ISA id (lab receives 835s through its clearinghouse), not the payer id"
    probability_835_name_differs_from_837: {value: 0.6, confidence: low}
    probability_835_payer_id_absent_or_different: {value: 0.35, confidence: low, note: "parser must resolve by TRN03/REF*2U/name alias"}
    source: [trn03_conventions, cms_835_cg, payer_ids]

