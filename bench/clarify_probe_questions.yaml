# Clarification probe set (not in bench/question_splits.json; never mixed into TRAIN/VAL/TEST runs).
# Written for the analyzer `ask` experiment because the frozen splits hold no ambiguous question and one
# unanswerable (PHI) item in VAL. Authored from the sem.* schema and general principles only; no VAL/TEST text.
#
# expect_clarification: the question has materially different readings (checked on snapshot 4ae0001be5a8: the
#   readings give different numbers) or misses a required scope. Correct = the run asks (final kind clarification).
# expect_unanswerable: the data cannot answer it (no such field in sem.* or lossless.*), and it is not a PHI or
#   other-customer request. Correct = the run refuses or asks.
# `readings` documents why; the agent never sees it.
- id: cp_amb_denial_rate_august
  category: clarify_probe_ambiguous
  difficulty: easy
  expect_clarification: true
  question: What was our denial rate in August 2026?
  readings: [payment month (835) 4.1%, service month 0.0% on this snapshot; the glossary says use the date the question names, and it names none]
