<path d="M160 636 L50 636 L50 143 L158 143" fill="none" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
<text class="ts" x="54" y="668" dominant-baseline="central">short summary,</text>
<text class="ts" x="54" y="684" dominant-baseline="central">may plan another step</text>

<line x1="280" y1="656" x2="280" y2="694" class="arr" marker-end="url(#arrow)"/>
<rect x="160" y="696" width="240" height="50" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="280" y="713" text-anchor="middle" dominant-baseline="central">Server builds tables,</text>
<text class="ts" x="280" y="731" text-anchor="middle" dominant-baseline="central">charts, findings</text>
<line class="leader" x1="402" y1="721" x2="434" y2="721"/>
<text class="ts" x="440" y="713" dominant-baseline="central" style="fill:var(--text-accent)">table + chart + finding;</text>
<text class="ts" x="440" y="729" dominant-baseline="central" style="fill:var(--text-accent)">evidence saved</text>

<rect x="140" y="764" width="280" height="92" rx="12" fill="none" stroke="#7F77DD" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="152" y="780" dominant-baseline="central">AI: write</text>
<line x1="280" y1="746" x2="280" y2="792" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="160" y="794" width="240" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="280" y="811" text-anchor="middle" dominant-baseline="central">Writer</text>
<text class="ts" x="280" y="829" text-anchor="middle" dominant-baseline="central">prose with placeholders</text></g>
<line class="leader" x1="422" y1="819" x2="434" y2="819"/>
<text class="ts" x="440" y="811" dominant-baseline="central" style="fill:var(--text-accent)">"CPT {{e1_r0_label}} has the</text>
