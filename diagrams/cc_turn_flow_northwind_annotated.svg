<text class="ts" x="280" y="482" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-accent)">compiled, parameterized query</text>

<line x1="280" y1="496" x2="280" y2="524" class="arr" marker-end="url(#arrow)"/>
<g class="c-teal">
<path d="M180 534 L180 576 A100 8 0 0 0 380 576 L380 534 Z" stroke-width="0.5"/>
