<text class="ts" x="540" y="421" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-accent)">turn paused; ticks both</text>
<text class="ts" x="540" y="437" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-accent)">resume: no new planning call</text>
