<text class="ts" x="540" y="561" text-anchor="middle" dominant-baseline="central">(built, not connected)</text>
<line x1="440" y1="551" x2="384" y2="551" class="arr" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

<line x1="280" y1="584" x2="280" y2="614" class="arr" marker-end="url(#arrow)"/>
<rect x="160" y="616" width="240" height="40" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="280" y="636" text-anchor="middle" dominant-baseline="central">Results + evidence</text>
<line class="leader" x1="402" y1="636" x2="434" y2="636"/>
<text class="ts" x="440" y="620" dominant-baseline="central" style="fill:var(--text-accent)">CPT 81479: 18.4% (46 of 250)</text>
<text class="ts" x="440" y="636" dominant-baseline="central" style="fill:var(--text-accent)">CPT 87798: 12.1% (29 of 240)</text>
