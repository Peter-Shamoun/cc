<svg width="100%" viewBox="0 0 680 1030" role="img"><title>CC turn flow annotated with the Northwind example</title><desc>The current-state flowchart with the running example beside each step: the Northwind denial-rate question, the run_tasks call, the denial-rate definition, the payer resolver suggesting two Northwind names, the user ticking both and resuming without a new planning call, the compiled query, result rows for CPT 81479 and 87798, the Writer's placeholder sentence, value fill-in and checks, and the final answer.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

<rect x="160" y="30" width="240" height="40" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="280" y="50" text-anchor="middle" dominant-baseline="central">User question</text>
<line class="leader" x1="402" y1="50" x2="434" y2="50"/>
<text class="ts" x="440" y="43" dominant-baseline="central" style="fill:var(--text-accent)">"Which CPTs have the highest</text>
<text class="ts" x="440" y="59" dominant-baseline="central" style="fill:var(--text-accent)">denial rate for Northwind?"</text>

<rect x="140" y="88" width="280" height="92" rx="12" fill="none" stroke="#7F77DD" stroke-width="0.8" stroke-dasharray="5 4"/>
<text class="ts" x="152" y="104" dominant-baseline="central">AI: plan</text>
<g class="c-purple"><rect x="160" y="118" width="240" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="280" y="135" text-anchor="middle" dominant-baseline="central">Investigator</text>
<text class="ts" x="280" y="153" text-anchor="middle" dominant-baseline="central">picks typed tasks</text></g>
<line x1="280" y1="70" x2="280" y2="116" class="arr" marker-end="url(#arrow)"/>
<line class="leader" x1="422" y1="143" x2="434" y2="143"/>
<text class="ts" x="440" y="135" dominant-baseline="central" style="fill:var(--text-accent)">run_tasks: denial rate by CPT,</text>
<text class="ts" x="440" y="151" dominant-baseline="central" style="fill:var(--text-accent)">payer = "Northwind", final</text>

<line x1="280" y1="168" x2="280" y2="208" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="190" dominant-baseline="central">run_tasks</text>
<rect x="160" y="210" width="240" height="50" rx="8" class="box" stroke-width="0.5"/>
<text class="th" x="280" y="227" text-anchor="middle" dominant-baseline="central">Server checks the plan</text>
<text class="ts" x="280" y="245" text-anchor="middle" dominant-baseline="central">against business definitions</text>
<line class="leader" x1="402" y1="235" x2="434" y2="235"/>
<text class="ts" x="440" y="220" dominant-baseline="central" style="fill:var(--text-accent)">835s; rate = recorded denials</text>
<text class="ts" x="440" y="236" dominant-baseline="central" style="fill:var(--text-accent)">(status 4) ÷ remitted claims;</text>
<text class="ts" x="440" y="252" dominant-baseline="central" style="fill:var(--text-accent)">min 20 claims per CPT</text>

<line x1="280" y1="260" x2="280" y2="282" class="arr" marker-end="url(#arrow)"/>
<polygon points="280,284 360,320 280,356 200,320" class="box" stroke-width="0.5"/>
<text class="th" x="280" y="312" text-anchor="middle" dominant-baseline="central">Payer name</text>
<text class="th" x="280" y="330" text-anchor="middle" dominant-baseline="central">clear?</text>

<line x1="360" y1="320" x2="438" y2="320" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="399" y="308" text-anchor="middle" dominant-baseline="central">no</text>
<g class="c-purple"><rect x="440" y="280" width="200" height="82" rx="8" stroke-width="0.5"/>
<text class="th" x="540" y="296" text-anchor="middle" dominant-baseline="central">Payer Resolver (AI)</text>
<text class="ts" x="540" y="313" text-anchor="middle" dominant-baseline="central">suggests names</text></g>
<text class="ts" x="540" y="333" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-accent)">Northwind Health Plan,</text>
<text class="ts" x="540" y="349" text-anchor="middle" dominant-baseline="central" style="fill:var(--text-accent)">Northwind Medicare</text>

<line x1="540" y1="362" x2="540" y2="383" class="arr" marker-end="url(#arrow)"/>
<g class="c-coral"><rect x="440" y="385" width="200" height="66" rx="8" stroke-width="0.5"/>
