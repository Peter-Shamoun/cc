<line x1="280" y1="356" x2="280" y2="428" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="290" y="392" dominant-baseline="central">yes</text>
<rect x="160" y="430" width="240" height="66" rx="8" class="box" stroke-width="0.5"/>
