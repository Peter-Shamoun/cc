<text class="ts" x="280" y="572" text-anchor="middle" dominant-baseline="central">Neo4j / DuckDB</text></g>
<rect x="440" y="526" width="200" height="50" rx="8" fill="none" stroke="var(--t)" stroke-width="0.8" stroke-dasharray="5 4"/>
