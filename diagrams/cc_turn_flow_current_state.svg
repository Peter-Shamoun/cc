<!-- STATUS: CURRENT (built) - turn flow of the app as built (main @ ca5df10). Open: Payer Resolver still labeled "(AI)"; suggested label fixes not applied | source: chat "Mermaid flowchart of AI pipeline" (2026-10-23) | FLAG: uses the chat widget CSS classes/vars; renders unstyled standalone -->
<svg width="100%" viewBox="0 0 680 1000" role="img"><title>CC chat turn, current state</title><desc>User question goes to the Investigator (AI plan), which calls run_tasks. The server checks the plan; if the payer name is unclear, the Payer Resolver suggests names and the user picks. The server builds the query against claims data in Neo4j or DuckDB, producing results and evidence, which can loop back as a short summary to the Investigator. The server builds tables, charts and findings; the Writer (AI write) writes prose with placeholders; the server fills in numbers and checks each sentence; the answer is saved, then shown. Lane 2 AI-written SQL is built but not connected.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>

