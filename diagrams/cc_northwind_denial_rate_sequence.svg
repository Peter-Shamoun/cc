<svg width="100%" viewBox="0 0 680 890" role="img"><title>Running example: highest denial rate CPTs for Northwind</title><desc>Sequence of 17 messages between User, Server, Investigator, Payer Resolver, Claims data and Writer. The Investigator names a task, the server pins the denial-rate definition, the ambiguous payer pauses the turn for a user pick, the resume reruns the stored task without a new planning call, and the Writer's placeholders are filled and checked by the server before the answer is shown.</desc>
