<rect x="124" y="20" width="100" height="44" rx="8" class="box" stroke-width="0.5"/><text class="th" x="174" y="42" text-anchor="middle" dominant-baseline="central">Server</text>
<g class="c-purple"><rect x="232" y="20" width="104" height="44" rx="8" stroke-width="0.5"/><text class="th" x="284" y="35" text-anchor="middle" dominant-baseline="central">Investigator</text><text class="ts" x="284" y="52" text-anchor="middle" dominant-baseline="central">AI</text></g>
<g class="c-purple"><rect x="344" y="20" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="394" y="35" text-anchor="middle" dominant-baseline="central">Resolver</text><text class="ts" x="394" y="52" text-anchor="middle" dominant-baseline="central">Payer · AI</text></g>
<g class="c-teal"><rect x="454" y="20" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="504" y="42" text-anchor="middle" dominant-baseline="central">Claims data</text></g>
<g class="c-purple"><rect x="564" y="20" width="100" height="44" rx="8" stroke-width="0.5"/><text class="th" x="614" y="35" text-anchor="middle" dominant-baseline="central">Writer</text><text class="ts" x="614" y="52" text-anchor="middle" dominant-baseline="central">AI</text></g>

