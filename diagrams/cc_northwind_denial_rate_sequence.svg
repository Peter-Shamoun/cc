<text class="ts" x="70" y="88"><tspan class="th">1</tspan>  "Which CPTs have the highest denial rate for Northwind?"</text>
<text class="ts" x="182" y="128"><tspan class="th">2</tspan>  question + what the server can compute</text>
<text class="ts" x="182" y="168"><tspan class="th">3</tspan>  run_tasks: denial rate by CPT, payer = "Northwind", final</text>
<text class="ts" x="214" y="214"><tspan class="th">4</tspan>  check plan: claims from 835s, min 20 claims per CPT</text>
<text class="ts" x="226" y="232">rate = recorded denials / remitted claims</text>
<text class="ts" x="182" y="260"><tspan class="th">5</tspan>  is "Northwind" an exact loaded payer name?</text>
<text class="ts" x="182" y="300"><tspan class="th">6</tspan>  no</text>
<text class="ts" x="182" y="340"><tspan class="th">7</tspan>  suggest loaded names for "Northwind"</text>
<text class="ts" x="182" y="380"><tspan class="th">8</tspan>  Northwind Health Plan, Northwind Medicare</text>
<text class="ts" x="70" y="420"><tspan class="th">9</tspan>  card: which payers did you mean?</text>

<g class="c-amber"><rect x="20" y="446" width="200" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="120" y="461" text-anchor="middle" dominant-baseline="central">Turn pauses, no answer yet</text></g>

<text class="ts" x="70" y="502"><tspan class="th">10</tspan>  ticks both names</text>

<g class="c-amber"><rect x="20" y="528" width="320" height="30" rx="4" stroke-width="0.5"/><text class="ts" x="180" y="543" text-anchor="middle" dominant-baseline="central">Resume runs the stored task, no new planning call</text></g>

<text class="ts" x="182" y="584"><tspan class="th">11</tspan>  compiled, parameterized query</text>
<text class="ts" x="182" y="624"><tspan class="th">12</tspan>  rows: CPT 81479 = 18.4% (46 of 250), CPT 87798 = 12.1% (29 of 240) …</text>
<text class="ts" x="214" y="682"><tspan class="th">13</tspan>  build table + chart + finding, save evidence</text>
<text class="ts" x="182" y="712"><tspan class="th">14</tspan>  brief of named facts (no raw records)</text>
<text class="ts" x="182" y="752"><tspan class="th">15</tspan>  "CPT {{e1_r0_label}} has the highest rate at {{e1_r0_rate}} …"</text>
<text class="ts" x="214" y="810"><tspan class="th">16</tspan>  fill in values, check each sentence</text>
<text class="ts" x="70" y="840"><tspan class="th">17</tspan>  answer: prose + table + chart + "how this was counted"</text>
</svg>
