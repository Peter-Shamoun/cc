<line x1="64" y1="64" x2="64" y2="870"/><line x1="174" y1="64" x2="174" y2="870"/><line x1="284" y1="64" x2="284" y2="870"/><line x1="394" y1="64" x2="394" y2="870"/><line x1="504" y1="64" x2="504" y2="870"/><line x1="614" y1="64" x2="614" y2="870"/>
</g>

